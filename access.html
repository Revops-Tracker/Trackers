<!doctype html>
<html lang="en">
<head>
<script>
  window.JF_PAGE = 'access';
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]demo=1/.test(location.search)) window.JF_DEMO = window.JF_LOGIN = true;
</script>
<script src="config.js"></script><script src="sso.js?v=20261111a"></script>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #EEF1F6; --panel: #FFFFFF; --ink: #14213D; --muted: #5B6782; --line: #D9DFE9; --accent: #2F5BEA; --accent-soft: #E4EAFB;
    --good: #1F8A5B; --good-soft: #E3F3EB; --bad: #C2410C; --bad-soft: #FBEAE2; --chip: #E4E9F1;
    --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; --body: "Barlow", "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0F1626; --panel: #172036; --ink: #E8ECF5; --muted: #97A3BD; --line: #26324D; --accent: #6E8EFF; --accent-soft: #2E3D66;
    --good: #4CC38A; --good-soft: #1B3A31; --bad: #F08A5D; --bad-soft: #3D2A24; --chip: #222D45; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--body); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 5vw, 48px); line-height: 1; margin: 0 0 4px; }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .card + .card { margin-top: 20px; }
  .card h2 { margin: 0 0 12px; font-family: var(--display); font-size: 22px; font-weight: 700; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 12.5px; margin: 1px 3px 1px 0; }
  .chip.admin { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .dim { color: var(--muted); }
  .acts { text-align: right; white-space: nowrap; }
  .ghost { font: inherit; font-size: 13px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 4px 11px; cursor: pointer; margin-left: 4px; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .ghost.del:hover { border-color: var(--bad); color: var(--bad); }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  @media (max-width: 700px) { form { grid-template-columns: 1fr; } }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  input[type=email], select { font: inherit; font-size: 15px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 0; grid-column: 1 / -1; }
  legend { font-size: 13px; color: var(--muted); font-weight: 600; padding: 0 4px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .checks label { font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; grid-column: 1 / -1; }
  .row { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 20px; cursor: pointer; }
  .btn[disabled] { opacity: .5; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .log { font-size: 13px; color: var(--muted); margin: 0; padding-left: 18px; }
  .log li { margin-bottom: 3px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 20px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Access</h1>
    <p>Who can sign in to the sales trackers, and what they see. Changes apply the next time that person loads a page.</p>
  </header>
  <main id="view"><div class="loading">Loading&hellip;</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var API = 'https://ottvswkgqohurzilfafu.supabase.co/functions/v1/jf-access';
  var S = null, editing = null;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 2600); }
  function token() { try { return localStorage.getItem('jf_token'); } catch (e) { return null; } }
  var ROLE = { admin: 'Admin &mdash; every tracker, Sales L10, RevOps L10, and this page', rep: 'Rep &mdash; only the pages ticked; edits their own numbers', view: 'View only &mdash; only the pages ticked; can&rsquo;t change anything' };
  function label(k) { var p = S.pages.filter(function (x) { return x.key === k; })[0]; return p ? p.label : k; }

  function form() {
    var e = editing || { email: '', rep: '', role: 'rep', access: [] };
    var reps = [].concat(S.reps.bdr.map(function (r) { return ['bdr', r]; }), S.reps.ae.map(function (r) { return ['ae', r]; }), S.reps.cst.map(function (r) { return ['cst', r]; }));
    return '<div class="card" id="formcard"><h2>' + (editing ? 'Edit ' + esc(e.email) : 'Add someone') + '</h2><form id="f" autocomplete="off">' +
      '<label class="f">Google work email<input type="email" id="f-email" required value="' + esc(e.email) + '"' + (editing ? ' readonly' : '') + ' placeholder="name@jumpfactor.net"></label>' +
      '<label class="f">Role<select id="f-role">' + S.roles.map(function (r) { return '<option value="' + r + '"' + (r === e.role ? ' selected' : '') + '>' + r.charAt(0).toUpperCase() + r.slice(1) + '</option>'; }).join('') + '</select></label>' +
      '<label class="f">Their name on a tracker (optional)<select id="f-rep"><option value="">&mdash; none &mdash;</option>' +
        reps.map(function (r) { return '<option value="' + esc(r[1]) + '"' + (r[1] === e.rep ? ' selected' : '') + '>' + esc(r[1]) + ' (' + r[0].toUpperCase() + ')</option>'; }).join('') + '</select></label>' +
      '<p class="hint" id="f-rolehint" style="grid-column:auto;align-self:end">' + ROLE[e.role] + '</p>' +
      '<fieldset><legend>Pages</legend><div class="checks">' + S.pages.map(function (p) {
        return '<label><input type="checkbox" value="' + p.key + '"' + (e.access.indexOf(p.key) >= 0 ? ' checked' : '') + '> ' + esc(p.label) + '</label>'; }).join('') + '</div></fieldset>' +
      '<p class="hint">Pick a tracker name only for reps who log their own numbers &mdash; it decides whose rows they can edit. Admins see every tracker and both L10s anyway; Hygiene always has to be ticked. Tick Sales L10 or RevOps L10 to give a non-admin just that page.</p>' +
      '<div class="row"><button class="btn" type="submit" id="f-save">' + (editing ? 'Save changes' : 'Add') + '</button>' + (editing ? '<button class="ghost" type="button" id="f-cancel">Cancel</button>' : '') + '</div></form></div>';
  }
  function table() {
    return '<div class="card"><h2>People with access (' + S.roster.length + ')</h2><div class="tablewrap"><table><thead><tr><th>Email</th><th>Role</th><th>Tracker name</th><th>Pages</th><th></th></tr></thead><tbody>' +
      S.roster.map(function (r) {
        var pages = r.role === 'admin' ? '<span class="dim">All trackers + L10s</span>' + ((r.access || []).indexOf('hygiene') >= 0 ? ' <span class="chip">Hygiene</span>' : '') :
          (r.access || []).map(function (a) { return '<span class="chip">' + esc(label(a)) + '</span>'; }).join('');
        var me = r.email === S.me;
        return '<tr><td>' + esc(r.email) + (me ? ' <span class="dim">(you)</span>' : '') + '</td><td><span class="chip' + (r.role === 'admin' ? ' admin' : '') + '">' + esc(r.role) + '</span></td><td>' + esc(r.rep || '') + '</td><td>' + pages + '</td>' +
          '<td class="acts"><button class="ghost" data-edit="' + esc(r.email) + '">Edit</button>' + (me ? '' : '<button class="ghost del" data-del="' + esc(r.email) + '">Remove</button>') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  function changes() {
    if (!S.changes.length) return '';
    var fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Toronto', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    return '<div class="card"><h2>Recent changes</h2><ul class="log">' + S.changes.map(function (c) {
      return '<li>' + fmt.format(new Date(c.at)) + ' &middot; ' + esc(c.by_email) + ' ' + (c.action === 'remove' ? 'removed' : c.action === 'add' ? 'added' : 'updated') + ' <b>' + esc(c.email) + '</b>' +
        (c.after ? ' as ' + esc(c.after.role) + ((c.after.access || []).length ? ' (' + c.after.access.map(label).map(esc).join(', ') + ')' : '') : '') + '</li>';
    }).join('') + '</ul></div>';
  }
  function render() { $('view').innerHTML = form() + table() + changes(); bind(); }

  function bind() {
    $('f-role').onchange = function () { $('f-rolehint').innerHTML = ROLE[this.value]; };
    $('f').onsubmit = function (ev) {
      ev.preventDefault();
      var body = { email: $('f-email').value, role: $('f-role').value, rep: $('f-rep').value || null,
        access: Array.prototype.map.call(document.querySelectorAll('#f input[type=checkbox]:checked'), function (c) { return c.value; }) };
      $('f-save').disabled = true;
      post('/save', body).then(function () { toast(editing ? 'Saved' : 'Added ' + body.email); editing = null; return load(); })
        .catch(function (e) { toast(e.message); $('f-save').disabled = false; });
    };
    if ($('f-cancel')) $('f-cancel').onclick = function () { editing = null; render(); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
      b.onclick = function () { var em = b.getAttribute('data-edit'); editing = S.roster.filter(function (r) { return r.email === em; })[0]; render(); $('formcard').scrollIntoView({ behavior: 'smooth' }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (b) {
      b.onclick = function () {
        var em = b.getAttribute('data-del');
        if (!confirm('Remove ' + em + '? They will be signed out of every tracker page.')) return;
        post('/remove', { email: em }).then(function () { toast('Removed ' + em); return load(); }).catch(function (e) { toast(e.message); });
      };
    });
  }
  function post(path, body) {
    if (window.JF_DEMO) return Promise.reject(new Error('Demo mode: nothing saved'));
    return fetch(API + path, { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + token() }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || j.error) throw new Error(j.error || ('Error ' + r.status)); return j; }); });
  }
  function load() {
    var req = window.JF_DEMO ? fetch('demo-access.json') : fetch(API + '/list', { headers: { Authorization: 'Bearer ' + token() } });
    return req.then(function (r) { return r.json(); }).then(function (j) { if (j.error) throw new Error(j.error); S = j; render(); });
  }
  load().catch(function (e) { $('view').innerHTML = '<div class="loading">' + esc(e.message) + '</div>'; });
})();
</script>
</body>
</html>
