<style>
  :root {
    --paper: #EEF1F6; --panel: #FFFFFF; --ink: #14213D; --muted: #5B6782;
    --line: #D9DFE9; --accent: #2F5BEA; --accent-soft: #E4EAFB;
    --good: #1F8A5B; --good-soft: #E3F3EB; --bad: #C2410C; --bad-soft: #FBEAE2;
    --warn: #A16207; --warn-soft: #FDF3D7; --chip: #E4E9F1;
    --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Barlow", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F1626; --panel: #172036; --ink: #E8ECF5; --muted: #97A3BD;
      --line: #26324D; --accent: #6E8EFF; --accent-soft: #2E3D66;
      --good: #4CC38A; --good-soft: #1B3A31; --bad: #F08A5D; --bad-soft: #3D2A24;
      --warn: #E8B949; --warn-soft: #3A3120; --chip: #222D45;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--body); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
  header h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 5vw, 48px); line-height: 1; margin: 0 0 4px; }
  header p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
  .bar .grow { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .seg button { font: inherit; font-size: 13.5px; border: none; background: none; color: var(--ink); padding: 6px 16px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: var(--paper); font-weight: 600; }
  .ghost { font: inherit; font-size: 13px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .ghost[disabled] { opacity: .4; cursor: default; }
  .updated { font-size: 12.5px; color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .funnel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-bottom: 20px; }
  @media (max-width: 860px) { .funnel { grid-template-columns: repeat(2, 1fr); gap: 12px; } .arrow { display: none; } }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; position: relative; margin-right: 30px; }
  @media (max-width: 860px) { .stage { margin-right: 0; } }
  .stage h3 { margin: 0 0 8px; font-family: var(--display); font-size: 19px; font-weight: 700; }
  .stage .big { font-family: var(--display); font-size: 36px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .stage .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  .stage .rows { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .stage .r { display: flex; justify-content: space-between; font-size: 14px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .stage .r span:first-child { color: var(--muted); }
  .stage .r b.pend { color: var(--warn); }
  .arrow { position: absolute; right: -31px; top: 50%; transform: translateY(-50%); width: 32px; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.2; z-index: 1; }
  .arrow .pc { display: block; font-weight: 700; color: var(--ink); font-size: 12px; }
  .cols { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .card + .card { margin-top: 20px; }
  .card h2 { margin: 0 0 4px; font-family: var(--display); font-size: 22px; font-weight: 700; }
  .card .sub { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }
  td .why { display: block; font-size: 12px; color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tablewrap { overflow-x: auto; }
  .st { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .st.held, .st.run { background: var(--good-soft); color: var(--good); }
  .st.noshow { background: var(--bad-soft); color: var(--bad); }
  .st.pending { background: var(--warn-soft); color: var(--warn); }
  .st.upcoming, .st.moved, .st.ex { background: var(--chip); color: var(--muted); }
  .edited { font-size: 11.5px; color: var(--accent); font-weight: 600; margin-left: 4px; }
  .acts { white-space: nowrap; text-align: right; }
  .acts button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; margin-left: 4px; }
  .acts button:hover { border-color: var(--accent); color: var(--accent); }
  .acts button.yes { border-color: var(--good); color: var(--good); }
  .acts button.no { border-color: var(--bad); color: var(--bad); }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14px; font-variant-numeric: tabular-nums; }
  .kv span:first-child { color: var(--muted); }
  .kv b.good { color: var(--good); } .kv b.bad { color: var(--bad); }
  .goal input { font: inherit; width: 84px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); text-align: right; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 18px; cursor: pointer; margin-top: 8px; }
  .defs { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; padding-left: 18px; }
  .defs li { margin-bottom: 4px; } .defs strong { color: var(--ink); }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 20px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }
  .needs { border-color: var(--warn); }
  .stage.go { cursor: pointer; transition: border-color .15s; }
  .stage.go:hover, .stage.go:focus-visible { border-color: var(--accent); outline: none; }
  .stage .see { float: right; font-family: var(--body); font-size: 12px; font-weight: 600; color: var(--accent); }
  .conv { margin-bottom: 20px; }
  .conv .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 860px) { .conv .grid { grid-template-columns: repeat(2, 1fr); } }
  .cbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--paper); cursor: pointer; text-align: left; font: inherit; color: var(--ink); }
  .cbox:hover, .cbox:focus-visible { border-color: var(--accent); outline: none; }
  .cbox .k { font-size: 12.5px; color: var(--muted); }
  .cbox .v { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .cbox .d { font-size: 12.5px; color: var(--muted); }
  tr.grp td { background: var(--paper); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  td.ck { text-align: center; font-weight: 700; }
  td.ck.y { color: var(--good); } td.ck.n { color: var(--muted); font-weight: 400; }
</style>

<body>
<div class="wrap">
  <header>
    <h1>AE Tracker</h1>
    <p>Disco &rarr; Design/Audit &rarr; Prop Review/Contract &rarr; Close. Fills itself from HubSpot every hour; you only fix what&rsquo;s wrong.</p>
  </header>
  <div class="bar" id="bar"></div>
  <main id="view"><div class="loading">Loading&hellip;</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var API = 'https://ottvswkgqohurzilfafu.supabase.co/functions/v1/ae-v2';
  var TZ = 'America/Toronto', PORTAL = '1905790';
  var RETIRED = ['Armin'];
  var S = null, rep = null, period = 'month', list = 'audit', proc = 'new';
  var CUT = '2026-10-27';   // official switch to the 3-call close; replaced by lb_auto_config.process_cutover on load
  var MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function cutLabel() { return MONS[+CUT.slice(5, 7) - 1] + ' ' + (+CUT.slice(8, 10)); }
  try { period = sessionStorage.getItem('aev2-period') || 'month'; list = sessionStorage.getItem('aev2-list') || 'audit'; proc = sessionStorage.getItem('aev2-proc') || 'new'; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 2600); }
  var fmtDay = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  var fmtShow = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  function dayOf(iso) { return fmtDay.format(new Date(iso)); }
  function pct(a, b) { return b > 0 ? Math.round(a / b * 100) + '%' : '–'; }
  function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
  function token() { try { return localStorage.getItem('jf_token'); } catch (e) { return null; } }

  // ---- periods (Toronto dates, inclusive) ----
  function today() { return dayOf(new Date().toISOString()); }
  function addDays(d, n) { var x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
  function range(p) {
    var t = today(), y = +t.slice(0, 4), m = +t.slice(5, 7);
    if (p === 'since') return { a: CUT, b: t, label: 'Since ' + cutLabel() };
    if (p === 'quarter') { var q0 = Math.floor((m - 1) / 3) * 3 + 1, qa = y + '-' + String(q0).padStart(2, '0') + '-01', qe = q0 + 3 > 12 ? (y + 1) + '-01-01' : y + '-' + String(q0 + 3).padStart(2, '0') + '-01'; return { a: qa, b: addDays(qe, -1), label: 'This quarter (Q' + ((q0 + 2) / 3) + ')' }; }
    if (p === 'week') { var dow = (new Date(t + 'T12:00:00Z').getUTCDay() + 6) % 7; return { a: addDays(t, -dow), b: addDays(t, 6 - dow), label: 'This week' }; }
    if (p === 'last') { var lm = m === 1 ? 12 : m - 1, ly = m === 1 ? y - 1 : y; var a = ly + '-' + String(lm).padStart(2, '0') + '-01'; return { a: a, b: addDays(t.slice(0, 8) + '01', -1), label: 'Last month' }; }
    return { a: t.slice(0, 8) + '01', b: addDays(addDays(t.slice(0, 8) + '28', 4).slice(0, 8) + '01', -1), label: 'This month' };
  }
  function inR(iso, r) { var d = dayOf(iso); return d >= r.a && d <= r.b; }
  function workdays(a, b) { var n = 0; for (var d = a; d <= b; d = addDays(d, 1)) { var w = new Date(d + 'T12:00:00Z').getUTCDay(); if (w && w < 6) n++; } return n; }

  // ---- rows with the AE's corrections applied ----
  // old vs new process (11-13): a deal belongs to the process of its FIRST discovery call (before the cutover = old)
  function isOld(x) { var f = x.deal_id && S.firstDisco && S.firstDisco[x.deal_id]; return !!f && dayOf(f) < CUT; }
  function rows(all0) {
    var ov = {}; (S.overrides || []).forEach(function (o) { ov[o.key] = o; });
    var all = S.items.concat(S.discos).filter(function (x) { return x.rep === rep && (all0 || proc === 'all' || !isOld(x)); });
    return all.map(function (x) {
      var o = ov[x.key], y = Object.assign({}, x, { auto: x.status, ov: o || null });
      if (o && o.status) y.status = o.status;
      if (o && o.exclude) y.excluded = true;
      return y;
    });
  }
  function count(rs, r) {
    var c = { dRun: 0, dRunB: 0, dRunI: 0, dNs: 0, dPend: 0, aBook: 0, aRun: 0, aNs: 0, aPend: 0, aUp: 0, pBook: 0, pRun: 0, pNs: 0, pPend: 0, pUp: 0, won: 0, mrr: 0, dq: 0, wonHT: 0, wonLT: 0, wonNS: 0 };
    rs.forEach(function (x) {
      if (x.excluded || !inR(x.at, r)) return;
      if (x.kind === 'disco') { if (x.status === 'run') { c.dRun++; x.src === 'bdr' ? c.dRunB++ : c.dRunI++; } else if (x.status === 'noshow') c.dNs++; else if (x.status === 'pending' && new Date(x.at) < new Date()) c.dPend++; }
      else if (x.kind === 'audit_booked') c.aBook++;
      else if (x.kind === 'prop_booked') c.pBook++;
      else if (x.kind === 'audit_call') { if (x.status === 'held') c.aRun++; else if (x.status === 'noshow') c.aNs++; else if (x.status === 'pending') c.aPend++; else if (x.status === 'upcoming') c.aUp++; }
      else if (x.kind === 'prop_call') { if (x.status === 'held') c.pRun++; else if (x.status === 'noshow') c.pNs++; else if (x.status === 'pending') c.pPend++; else if (x.status === 'upcoming') c.pUp++; }
      else if (x.kind === 'won') { c.won++; c.mrr += Number(x.amount) || 0; if (x.offer === 'lt') c.wonLT++; else if (x.offer === 'ht') c.wonHT++; else c.wonNS++; }
      else if (x.kind === 'dq') c.dq++;
    });
    return c;
  }

  // ---- conversion (new process): follow each deal from its first disco ----
  // ---- conversion: past tense only ----
  // Each step starts from calls that actually RAN in the period (one per deal), then counts how many of those deals
  // have since reached the next stage (same day or later, up to today). Booked-but-not-run calls don't count until they happen.
  function steps(rs, rg) {
    var by = {}; rs.forEach(function (x) { if (!x.excluded && x.deal_id) (by[x.deal_id] = by[x.deal_id] || []).push(x); });
    function after(x, test) { var d = dayOf(x.at); return (by[x.deal_id] || []).some(function (y) { return y !== x && test(y) && dayOf(y.at) >= d; }); }
    function runs(test) { var seen = {}, out = [];
      rs.filter(function (x) { return !x.excluded && x.deal_id && test(x) && inR(x.at, rg); }).sort(function (a, b) { return a.at < b.at ? -1 : 1; })
        .forEach(function (x) { if (!seen[x.deal_id]) { seen[x.deal_id] = 1; out.push(x); } });
      return out.reverse(); }
    var toAudit = function (y) { return y.kind === 'audit_booked' || (y.kind === 'audit_call' && y.status !== 'moved'); };
    var toProp = function (y) { return y.kind === 'prop_booked' || (y.kind === 'prop_call' && y.status !== 'moved'); };
    var toWon = function (y) { return y.kind === 'won'; };
    return {
      d: runs(function (x) { return x.kind === 'disco' && x.status === 'run'; }).map(function (x) { return { x: x, next: after(x, toAudit), won: after(x, toWon) }; }),
      a: runs(function (x) { return x.kind === 'audit_call' && x.status === 'held'; }).map(function (x) { return { x: x, next: after(x, toProp), won: after(x, toWon) }; }),
      p: runs(function (x) { return x.kind === 'prop_call' && x.status === 'held'; }).map(function (x) { return { x: x, next: after(x, toWon) }; })
    };
  }
  var cnt = function (arr, k) { return arr.filter(function (y) { return y[k]; }).length; };
  function convCard(st, rg) {
    function box(k, num, den, of) { return '<button type="button" class="cbox" data-conv="1"><div class="k">' + k + '</div><div class="v">' + pct(num, den) + '</div><div class="d">' + num + ' of ' + den + ' ' + of + '</div></button>'; }
    return '<div class="card conv"><h2>Conversion &mdash; ' + rg.label.toLowerCase() + '</h2><p class="sub">Past tense only. Each step starts from calls that <b>actually ran</b> ' + (period === 'since' ? 'since ' + cutLabel() : rg.label.toLowerCase()) +
      ', then counts how many of those deals have since moved to the next stage. Booked audits and prop reviews that haven&rsquo;t happened yet aren&rsquo;t counted. Click a box to see each deal.</p><div class="grid">' +
      box('Disco &rarr; Design/Audit', cnt(st.d, 'next'), st.d.length, 'discos run moved to Design/Audit') +
      box('Design/Audit &rarr; Prop Review/Contract', cnt(st.a, 'next'), st.a.length, 'audits run moved to Prop Review') +
      box('Prop Review/Contract &rarr; Closed won', cnt(st.p, 'next'), st.p.length, 'prop reviews run closed') +
      box('Disco &rarr; Closed won', cnt(st.d, 'won'), st.d.length, 'discos run closed') + '</div></div>';
  }

  // ---- views ----
  function renderBar() {
    var reps = S.settings.map(function (s) { return s.rep; }).filter(function (r) { return RETIRED.indexOf(r) < 0; });
    if (!rep || reps.indexOf(rep) < 0) rep = (S.me.rep && reps.indexOf(S.me.rep) >= 0) ? S.me.rep : reps[0];
    var run = S.lastRun ? new Date(S.lastRun.ran_at) : null;
    $('bar').innerHTML =
      (reps.length > 1 ? '<div class="seg" id="reps">' + reps.map(function (r) { return '<button data-r="' + esc(r) + '"' + (r === rep ? ' class="on"' : '') + '>' + esc(r) + '</button>'; }).join('') + '</div>' : '') +
      '<div class="seg" id="per">' + [['week', 'This week'], ['month', 'This month'], ['last', 'Last month'], ['quarter', 'This quarter'], ['since', 'Since ' + cutLabel()]].map(function (p) { return '<button data-p="' + p[0] + '"' + (p[0] === period ? ' class="on"' : '') + '>' + p[1] + '</button>'; }).join('') + '</div>' +
      '<div class="seg" id="proc" title="A deal belongs to the process of its first discovery call. Deals whose first disco was before ' + cutLabel() + ' are the old process.">' + [['new', 'New process'], ['all', 'All deals']].map(function (p) { return '<button data-q="' + p[0] + '"' + (p[0] === proc ? ' class="on"' : '') + '>' + p[1] + '</button>'; }).join('') + '</div>' +
      '<span class="grow"></span><span class="updated">' + (run ? 'HubSpot synced ' + fmtShow.format(run) : 'Not synced yet') + ' &middot; discos sync daily 8am</span>' +
      '<button class="ghost" id="refresh">Refresh now</button>';
    Array.prototype.forEach.call(document.querySelectorAll('#reps button'), function (b) { b.onclick = function () { rep = b.getAttribute('data-r'); render(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('#per button'), function (b) { b.onclick = function () { period = b.getAttribute('data-p'); try { sessionStorage.setItem('aev2-period', period); } catch (e) {} render(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('#proc button'), function (b) { b.onclick = function () { proc = b.getAttribute('data-q'); try { sessionStorage.setItem('aev2-proc', proc); } catch (e) {} render(); }; });
    $('refresh').onclick = refresh;
  }

  function stage(title, big, lbl, rowsHtml, arrowPct, go) {
    return '<div class="stage' + (go ? ' go" tabindex="0" role="button" data-go="' + go + '" aria-label="' + title + ': see deals' : '') + '"><h3>' + title + (go ? '<span class="see">See deals &rsaquo;</span>' : '') + '</h3><div class="big">' + big + '</div><div class="lbl">' + lbl + '</div><div class="rows">' + rowsHtml + '</div>' +
      (arrowPct != null ? '<div class="arrow" aria-hidden="true">&#9654;<span class="pc">' + arrowPct + '</span></div>' : '') + '</div>';
  }
  function r(k, v, cls) { return '<div class="r"><span>' + k + '</span><b' + (cls ? ' class="' + cls + '"' : '') + '>' + v + '</b></div>'; }

  function funnel(c, st) {
    return '<section class="funnel">' +
      stage('Discovery', c.dRun, 'discos run',
        r('BDR / Inbound', c.dRunB + ' / ' + c.dRunI) + r('No-shows', c.dNs) + r('Show rate (cancels not counted)', pct(c.dRun, c.dRun + c.dNs)) + (c.dPend ? r('Not confirmed yet', c.dPend, 'pend') : ''),
        pct(cnt(st.d, 'next'), st.d.length), 'disco') +
      stage('Design / Audit', c.aRun, 'audits run',
        r('Booked (moved to stage)', c.aBook) + r('No-shows', c.aNs) + r('Show rate', pct(c.aRun, c.aRun + c.aNs)) + (c.aPend ? r('Needs your answer', c.aPend, 'pend') : '') + (c.aUp ? r('Booked ahead', c.aUp) : ''),
        pct(cnt(st.a, 'next'), st.a.length), 'audit') +
      stage('Prop Review / Contract', c.pRun, 'prop reviews run',
        r('Booked (moved to stage)', c.pBook) + r('No-shows', c.pNs) + r('Show rate', pct(c.pRun, c.pRun + c.pNs)) + (c.pPend ? r('Needs your answer', c.pPend, 'pend') : '') + (c.pUp ? r('Booked ahead', c.pUp) : ''),
        pct(cnt(st.p, 'next'), st.p.length), 'prop') +
      stage('Closed won', c.won, 'closes', r('MRR closed', money(c.mrr)) + r('HT / LT', c.wonHT + ' / ' + c.wonLT) + (c.wonNS ? r('Offer not set', c.wonNS, 'pend') : '') + r('DQ&rsquo;d', c.dq) + r('Disco &rarr; close', pct(cnt(st.d, 'won'), st.d.length)), null, 'moves') +
      '</section>';
  }

  var LABEL = { held: 'Held', run: 'Showed', noshow: 'No-show', pending: 'Needs answer', upcoming: 'Booked', moved: 'Rebooked' };
  function dealLink(x) {
    var name = esc(x.deal_name || x.title || 'Unlinked meeting');
    return x.deal_id ? '<a href="https://app.hubspot.com/contacts/' + PORTAL + '/record/0-3/' + esc(x.deal_id) + '" target="_blank" rel="noopener">' + name + '</a>' : name;
  }
  function callRow(x, canEdit) {
    var st = x.excluded ? '<span class="st ex">Not counted</span>' : '<span class="st ' + esc(x.status) + '">' + (LABEL[x.status] || esc(x.status)) + '</span>';
    if (x.ov) st += '<span class="edited" title="Changed by ' + esc(x.ov.by_email) + (x.ov.note ? ': ' + esc(x.ov.note) : '') + '">edited</span>';
    var why = x.ov ? 'You set this' + (x.auto ? ' (HubSpot said: ' + (LABEL[x.auto] || x.auto) + ')' : '') : (x.detail || (x.kind === 'disco' ? 'show-up engine: ' + (x.lb_cat || '').replace(/_/g, ' ') : ''));
    var acts = '';
    if (canEdit && x.status !== 'upcoming') {
      var yes = x.kind === 'disco' ? 'run' : 'held';
      if (x.status !== yes || x.excluded) acts += '<button class="yes" data-k="' + esc(x.key) + '" data-s="' + yes + '">' + (x.kind === 'disco' ? 'Showed' : 'Held') + '</button>';
      if (x.status !== 'noshow' || x.excluded) acts += '<button class="no" data-k="' + esc(x.key) + '" data-s="noshow">No-show</button>';
      if (!x.excluded) acts += '<button data-k="' + esc(x.key) + '" data-x="1" title="Duplicate or not a real call">Don&rsquo;t count</button>';
      if (x.ov) acts += '<button data-k="' + esc(x.key) + '" data-clear="1">Undo</button>';
    }
    return '<tr><td>' + fmtShow.format(new Date(x.at)) + '</td><td>' + dealLink(x) + (x.src ? ' <span class="why">' + (x.src === 'bdr' ? 'BDR' : 'Inbound') + (x.offer ? ' &middot; ' + x.offer.toUpperCase() : '') + '</span>' : '') + '</td><td>' + st + '<span class="why">' + esc(why) + '</span></td><td class="acts">' + acts + '</td></tr>';
  }
  function canEdit() { return S.me.admin || S.me.rep === rep; }

  function needsCard(rs) {
    var pend = rs.filter(function (x) { return !x.excluded && x.status === 'pending' && (x.kind === 'audit_call' || x.kind === 'prop_call'); })
      .sort(function (a, b) { return a.at < b.at ? -1 : 1; });
    if (!pend.length) return '';
    return '<div class="card needs"><h2>Needs your answer (' + pend.length + ')</h2><p class="sub">These calls have passed but HubSpot has no Fathom recording or outcome. Did they happen?</p>' +
      '<div class="tablewrap"><table><thead><tr><th>When</th><th>Deal</th><th>Status</th><th></th></tr></thead><tbody>' +
      pend.map(function (x) { return callRow(x, canEdit()); }).join('') + '</tbody></table></div></div>';
  }

  function listCard(rs, rg) {
    var tabs = [['audit', 'Audits'], ['prop', 'Prop reviews'], ['disco', 'Discos'], ['moves', 'Stage moves'], ['funnel', 'Conversion detail']];
    if (list === 'funnel') return stepList(steps(rs, rg), rg, tabs);
    var pick = rs.filter(function (x) {
      if (!inR(x.at, rg)) return false;
      if (list === 'audit') return x.kind === 'audit_call';
      if (list === 'prop') return x.kind === 'prop_call';
      if (list === 'disco') return x.kind === 'disco';
      return ['audit_booked', 'prop_booked', 'won', 'dq'].indexOf(x.kind) >= 0;
    });
    var ORDER = { held: 0, run: 0, noshow: 1, pending: 2, upcoming: 3, moved: 4 };
    var grpOf = function (x) { return x.excluded ? 9 : (ORDER[x.status] != null ? ORDER[x.status] : 5); };
    if (list === 'moves') pick.sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    else pick.sort(function (a, b) { return (grpOf(a) - grpOf(b)) || (a.at < b.at ? 1 : -1); });
    var GRP = ['Held', 'No-show', 'Needs your answer', 'Booked ahead', 'Rebooked (not counted)', 'Other'];
    GRP[9] = 'Not counted';
    var withHeads = function (arr) { var out = '', last = null; arr.forEach(function (x) { var g = grpOf(x);
      if (g !== last) { var cnt = arr.filter(function (y) { return grpOf(y) === g; }).length; out += '<tr class="grp"><td colspan="4">' + (list === 'disco' && g === 0 ? 'Showed' : GRP[g]) + ' (' + cnt + ')</td></tr>'; last = g; }
      out += callRow(x, canEdit()); }); return out; };
    var MOVE = { audit_booked: 'Moved to Design/Audit', prop_booked: 'Moved to Prop Review/Contract', won: 'Closed won', dq: 'DQ&rsquo;d' };
    var body = !pick.length ? '<p class="empty">Nothing in ' + rg.label.toLowerCase() + '.</p>' :
      list === 'moves'
        ? '<table><thead><tr><th>When</th><th>Deal</th><th>Move</th><th class="num">MRR</th></tr></thead><tbody>' + pick.map(function (x) {
            return '<tr><td>' + fmtShow.format(new Date(x.at)) + '</td><td>' + dealLink(x) + (x.src ? ' <span class="why">' + (x.src === 'bdr' ? 'BDR' : 'Inbound') + (x.offer ? ' &middot; ' + x.offer.toUpperCase() : '') + '</span>' : '') + '</td><td>' + MOVE[x.kind] + '</td><td class="num">' + (x.kind === 'won' ? money(x.amount || 0) : '') + '</td></tr>';
          }).join('') + '</tbody></table>'
        : '<table><thead><tr><th>When</th><th>Deal</th><th>Status</th><th></th></tr></thead><tbody>' + withHeads(pick) + '</tbody></table>';
    return '<div class="card" id="detail"><div class="bar" style="margin:0 0 10px"><h2 style="margin:0">' + rg.label + ' &mdash; detail</h2><span class="grow"></span><div class="seg" id="lists">' +
      tabs.map(function (t) { return '<button data-l="' + t[0] + '"' + (t[0] === list ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="tablewrap">' + body + '</div>' +
      (list === 'disco' ? '<p class="sub" style="margin-top:8px">Disco show/no-show comes from the leaderboard&rsquo;s show-up engine (updated 8am daily). Changing one here only changes this tracker.</p>' : '') + '</div>';
  }

  function listTabs(tabs) {
    return '<div class="seg" id="lists">' + tabs.map(function (t) { return '<button data-l="' + t[0] + '"' + (t[0] === list ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('') + '</div>';
  }
  function stepList(st, rg, tabs) {
    var ck = function (b) { return '<td class="ck ' + (b ? 'y">&#10003;' : 'n">&ndash;') + '</td>'; };
    function tbl(title, arr, cols) {
      return '<h3 style="margin:14px 0 6px;font-size:15px">' + title + ' (' + arr.length + ')</h3>' + (!arr.length ? '<p class="empty">None ran in ' + rg.label.toLowerCase() + '.</p>' :
        '<table><thead><tr><th>Ran</th><th>Deal</th>' + cols.map(function (c) { return '<th>' + c[0] + '</th>'; }).join('') + '</tr></thead><tbody>' +
        arr.map(function (y) { return '<tr><td>' + fmtShow.format(new Date(y.x.at)) + '</td><td>' + dealLink(y.x) + '</td>' + cols.map(function (c) { return ck(y[c[1]]); }).join('') + '</tr>'; }).join('') + '</tbody></table>');
    }
    return '<div class="card" id="detail"><div class="bar" style="margin:0 0 10px"><h2 style="margin:0">' + rg.label + ' &mdash; conversion detail</h2><span class="grow"></span>' + listTabs(tabs) + '</div>' +
      '<p class="sub">Every call that ran in this period, and whether that deal has moved on since (any time up to today).</p><div class="tablewrap">' +
      tbl('Discos run', st.d, [['Moved to Design/Audit', 'next'], ['Closed won', 'won']]) +
      tbl('Audits run', st.a, [['Moved to Prop Review', 'next'], ['Closed won', 'won']]) +
      tbl('Prop reviews run', st.p, [['Closed won', 'next']]) + '</div></div>';
  }

  function paceCard(rs) {
    var s = S.settings.filter(function (x) { return x.rep === rep; })[0] || {};
    var m = range('month'), c = count(rs, m), t = today();
    var target = Number(s.monthly_close_target) || 0, r1 = (Number(s.rate_disco_audit) || 32) / 100, r2 = (Number(s.rate_audit_close) || 20) / 100;
    var wdT = workdays(m.a, m.b), wdE = workdays(m.a, t), wdL = Math.max(workdays(addDays(t, 1), m.b), 0);
    var pace = target * wdE / wdT, left = Math.max(target - c.won, 0);
    var needAudits = left / r2, needDiscos = needAudits / r1;
    var mrrT = Number(s.monthly_mrr_target) || 0;
    var ed = canEdit();
    function inp(id, v, step) { return ed ? '<input id="' + id + '" type="number" min="0" step="' + (step || 1) + '" value="' + esc(v) + '">' : '<b>' + esc(v) + '</b>'; }
    return '<div class="card"><h2>This month&rsquo;s pace</h2><p class="sub">' + wdE + ' of ' + wdT + ' working days gone</p>' +
      '<div class="kv"><span>Closes</span><b class="' + (c.won >= pace ? 'good' : 'bad') + '">' + c.won + ' / ' + target + '</b></div>' +
      '<div class="kv"><span>On-pace number today</span><b>' + pace.toFixed(1) + '</b></div>' +
      '<div class="kv"><span>MRR closed</span><b>' + money(c.mrr) + (mrrT ? ' / ' + money(mrrT) : '') + '</b></div>' +
      '<div class="kv"><span>Closes still needed</span><b>' + left + '</b></div>' +
      '<div class="kv"><span>Audits needed for that</span><b>' + Math.ceil(needAudits) + '</b></div>' +
      '<div class="kv"><span>Discos needed for that</span><b>' + Math.ceil(needDiscos) + (wdL ? ' &middot; ' + (needDiscos / wdL).toFixed(1) + '/day' : '') + '</b></div>' +
      '<div class="goal" style="margin-top:12px;border-top:1px dashed var(--line);padding-top:10px">' +
      '<div class="kv"><span>Monthly close target</span>' + inp('g-close', target) + '</div>' +
      '<div class="kv"><span>Monthly MRR target ($)</span>' + inp('g-mrr', mrrT, 100) + '</div>' +
      '<div class="kv"><span>Disco &rarr; Design/Audit %</span>' + inp('g-r1', Math.round(r1 * 1000) / 10, 0.1) + '</div>' +
      '<div class="kv"><span>Design/Audit &rarr; close %</span>' + inp('g-r2', Math.round(r2 * 1000) / 10, 0.1) + '</div>' +
      (ed ? '<button class="btn" id="g-save">Save targets</button>' : '') + '</div>' +
      '<ul class="defs"><li>The two rates start from 2026 HubSpot history (about 32% of discos reach Design, about 20% of Design deals close). Change them once the new process has its own numbers.</li></ul></div>';
  }

  function defsCard() {
    return '<div class="card"><h2>How it counts</h2><ul class="defs">' +
      '<li><strong>Discos run / no-shows</strong> &mdash; from the leaderboard&rsquo;s show-up engine, credited to the AE on the deal. Show rate here = held &divide; (held + no-show), so calls cancelled before the slot are left out. The Sales L10 shows 1st-time show three ways (excl. our cancels / all / excl. their cancels).</li>' +
      '<li><strong>Moved to Design/Audit</strong> and <strong>Moved to Prop Review</strong> &mdash; the day the deal entered that HubSpot stage.</li>' +
      '<li><strong>Audits / prop reviews run</strong> &mdash; MSP Audit and Proposal Review meetings (GHL calendars, synced to HubSpot). Checked in this order: the deal went to the no-show stage &rarr; no-show; the deal was already Closed Lost / DQ&rsquo;d before the call &rarr; needs your answer; Fathom recording or Completed outcome &rarr; held; the deal moved past that stage after the call &rarr; held. (The calendar sync marks calls Completed even when nobody showed, so a no-show stage move always wins.) Proposal Review, Proposal Decision and Program Discussion titles all count as prop reviews.</li>' +
      '<li><strong>New process / All deals</strong> &mdash; New process (the default) leaves out deals whose first discovery call was before ' + cutLabel() + ', so the rates only show the 3-call close. All deals puts the old-process deals back. This month&rsquo;s pace always counts every close.</li>' +
      '<li><strong>No-shows</strong> &mdash; the deal went to the no-show stage, or you marked it. Rebooked calls aren&rsquo;t counted twice.</li>' +
      '<li><strong>Closed won</strong> &mdash; by close date, MRR in USD. HT/LT from the deal&rsquo;s Offer field.</li>' +
      '<li><strong>Conversion</strong> (and the arrows between the boxes) is past tense only. Disco &rarr; Design/Audit = of the discos run in the period, how many have since moved to Design/Audit. Design/Audit &rarr; Prop Review = of the audits run, how many have since moved to Prop Review. Prop Review &rarr; Closed won = of the prop reviews run, how many have since closed. Disco &rarr; Closed won = of the discos run, how many have since closed.</li>' +
      '<li><strong>Booked (moved to stage)</strong> in the boxes = deals moved into that HubSpot stage in the period; many of those calls are still upcoming.</li>' +
      '<li>Low-ticket deals can close straight from the audit without a prop review.</li></ul></div>';
  }

  function render() {
    renderBar();
    var rs = rows(), rg = range(period), c = count(rs, rg), st = steps(rs, rg);
    $('view').innerHTML = funnel(c, st) + convCard(st, rg) + '<div class="cols"><div>' + needsCard(rows(true)) + listCard(rs, rg) + '</div><div>' + paceCard(rows(true)) + defsCard() + '</div></div>';
    bind();
  }

  function goList(l) {
    list = l; try { sessionStorage.setItem('aev2-list', list); } catch (e) {}
    render(); var d = $('detail'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function bind() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function (el) {
      el.onclick = function () { goList(el.getAttribute('data-go')); };
      el.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goList(el.getAttribute('data-go')); } };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-conv]'), function (el) { el.onclick = function () { goList('funnel'); }; });
    Array.prototype.forEach.call(document.querySelectorAll('#lists button'), function (b) { b.onclick = function () { list = b.getAttribute('data-l'); try { sessionStorage.setItem('aev2-list', list); } catch (e) {} render(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('.acts button'), function (b) {
      b.onclick = function () {
        var body = { key: b.getAttribute('data-k') };
        if (b.getAttribute('data-clear')) body.clear = true;
        else if (b.getAttribute('data-x')) { body.exclude = true; body.note = prompt('Why shouldn’t this count? (e.g. duplicate meeting)') || ''; if (!body.note) return; }
        else body.status = b.getAttribute('data-s');
        b.disabled = true;
        post('/mark', body).then(function () { toast('Saved'); return load(); }).catch(function (e) { toast(e.message); b.disabled = false; });
      };
    });
    var g = $('g-save');
    if (g) g.onclick = function () {
      g.disabled = true;
      post('/settings', { rep: rep, monthly_close_target: $('g-close').value, monthly_mrr_target: $('g-mrr').value, rate_disco_audit: $('g-r1').value, rate_audit_close: $('g-r2').value })
        .then(function () { toast('Targets saved'); return load(); }).catch(function (e) { toast(e.message); g.disabled = false; });
    };
  }

  // ---- io ----
  function post(path, body) {
    if (window.JF_DEMO) return Promise.reject(new Error('Demo mode: nothing saved'));
    return fetch(API + path, { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + token() }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || j.error) throw new Error(j.error || ('Error ' + r.status)); return j; }); });
  }
  function refresh() {
    var b = $('refresh'); b.disabled = true;
    post('/refresh', {}).then(function () { toast('Pulling from HubSpot, about a minute'); setTimeout(load, 70000); })
      .catch(function (e) { toast(e.message); }).then(function () { setTimeout(function () { if ($('refresh')) $('refresh').disabled = false; }, 3000); });
  }
  function load() {
    var since = range('last').a; if (CUT < since) since = CUT;
    var req = window.JF_DEMO ? fetch('demo-ae-v2.json') : fetch(API + '/state?since=' + since, { headers: { Authorization: 'Bearer ' + token() } });
    return req.then(function (r) {
      if (r.status === 401 && !window.JF_DEMO) { location.replace('index.html'); throw new Error('signed out'); }
      return r.json();
    }).then(function (j) { if (j.error) throw new Error(j.error); S = j; if (j.cutover) CUT = j.cutover; render(); });
  }
  load().catch(function (e) { $('view').innerHTML = '<div class="loading">Could not load: ' + esc(e.message) + '</div>'; });
})();
</script>
</body>
</html>
