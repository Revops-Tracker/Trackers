<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF1F6; --panel: #FFFFFF; --ink: #14213D; --muted: #5B6782;
    --line: #D9DFE9; --accent: #2F5BEA; --accent-soft: #E4EAFB;
    --good: #1F8A5B; --good-soft: #E3F3EB; --bad: #C2410C; --bad-soft: #FBEAE2;
    --input-bg: #FFFFFF; --input-line: #C5CEDF; --chip: #E4E9F1;
    --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Barlow", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F1626; --panel: #172036; --ink: #E8ECF5; --muted: #97A3BD;
      --line: #26324D; --accent: #6E8EFF; --accent-soft: #2E3D66;
      --good: #4CC38A; --good-soft: #1B3A31; --bad: #F08A5D; --bad-soft: #3D2A24;
      --input-bg: #1E2A44; --input-line: #3A4A70; --chip: #222D45;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.45 var(--body); }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 28px 20px 60px; }
  header h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 5vw, 48px); line-height: 1; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tab { border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    padding: 7px 16px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
  .tab:hover { border-color: var(--accent); }
  .tab.active { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 600; }
  .tab:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cols { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 840px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .card + .card { margin-top: 20px; }
  .card h2 { margin: 0 0 12px; font-family: var(--display); font-size: 22px; font-weight: 700;
    color: var(--ink); letter-spacing: 0; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 5px 0; }
  input[type="number"], input[type="date"] { font: inherit; color: var(--ink); background: var(--input-bg);
    border: 1px solid var(--input-line); border-radius: 6px; padding: 5px 9px; width: 110px;
    font-variant-numeric: tabular-nums; }
  .statusbar { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 18px; min-width: 128px; flex: 1; }
  .stat .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .stat .v { font-family: var(--display); font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .stat .sub { font-size: 12.5px; color: var(--muted); }
  .pill { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.flat { background: var(--accent-soft); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 9px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: none; }
  td.req { font-weight: 700; }
  td.warn { color: var(--bad); font-weight: 600; }
  td.good { color: var(--good); font-weight: 600; }
  td.dim, th.dim { color: var(--muted); }
  tr.total td { font-weight: 700; border-top: 1px solid var(--line); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--accent-soft); }
  .btn { font: inherit; font-size: 14px; font-weight: 600; background: var(--accent); color: #fff;
    border: none; border-radius: 6px; padding: 8px 20px; cursor: pointer; }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .ghost { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line);
    color: var(--muted); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
  .defs { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; padding-left: 18px; }
  .defs li { margin-bottom: 5px; }
  .defs strong { color: var(--ink); }
  .ref { font-size: 12px; color: var(--muted); min-width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 9px 20px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .ratebig { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .big-total { font-family: var(--display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }
  .subhead { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
    font-weight: 600; margin: 14px 0 2px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .outcomes { display: grid; grid-template-columns: 1fr; gap: 2px; margin-top: 4px; }
  .outcomes label { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 14px; padding: 3px 0; }
  .outcomes input { width: 82px; }
  .outcomes .code { font-weight: 700; font-size: 12px; color: var(--muted); }
  .recon { font-size: 12.5px; margin: 10px 0 0; padding: 7px 10px; border-radius: 6px;
    background: var(--accent-soft); color: var(--ink); }
  .recon.bad { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
  .recon.good { background: var(--good-soft); color: var(--good); }
  @media (prefers-color-scheme: dark) { input[type="date"] { color-scheme: dark; } }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .seg button { font: inherit; font-size: 13.5px; border: none; background: none; color: var(--ink); padding: 6px 16px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: var(--paper); font-weight: 600; }
  .hbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .hbar .label { font-size: 17px; font-weight: 700; min-width: 190px; text-align: center; }
  .trend { display: flex; align-items: flex-end; gap: 8px; height: 150px; margin-top: 12px; }
  .trend .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; min-width: 0; }
  .trend .bar { width: 100%; background: var(--line); border-radius: 4px 4px 0 0; min-height: 2px; }
  .trend .col:hover .bar { background: var(--accent-soft); }
  .trend .col.sel .bar { background: var(--accent); }
  .trend .n { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); margin-bottom: 3px; }
  .trend .col.sel .n { color: var(--ink); font-weight: 700; }
  .trend .l { font-size: 11px; color: var(--muted); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .ls-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .ls-bar .label { font-family: var(--display); font-size: 22px; font-weight: 700; min-width: 170px; text-align: center; }
  .ls-nav { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font-size: 18px; line-height: 1; }
  .ls-nav[disabled] { opacity: 0.35; cursor: default; }
  td.tierhead { text-align: left; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); background: var(--paper); }
  .st { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .st.ok { background: var(--good-soft); color: var(--good); }
  .st.miss { background: var(--bad-soft); color: var(--bad); }
  td.whycell { text-align: left; min-width: 260px; }
  input.note { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--input-bg); border: 1px solid var(--input-line); border-radius: 8px; padding: 6px 10px; }
  input.note.need { border-color: var(--bad); }
  input.note[disabled] { background: none; border-color: transparent; padding-left: 0; }
  .grid td, .grid th { text-align: center; }
  .grid td:first-child, .grid th:first-child { text-align: left; }
  .grid .why { display: block; font-size: 12px; color: var(--muted); font-style: italic; margin-top: 2px; white-space: normal; max-width: 220px; margin-left: auto; margin-right: auto; }
  .grid .nd { color: var(--bad); font-weight: 700; }
  .ls-sum { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .ls-sum .stat { min-width: 150px; flex: 0 1 200px; }
  .pctu { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; line-height: 1.3; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BDR Shortfall Tracker</h1>
    <p>Commit in the morning, log your day, see your gap. Saved for everyone &mdash; updates on refresh.</p>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"><div class="loading">Loading&hellip;</div></main>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  var BASE = '/api/bdr';
  // Team minimum: 780 dials a day across power + parallel. The rate math can ask for less than
  // this when a rep is converting well — the floor still stands, so it overrides the calculation.
  var DIAL_FLOOR = 780;
  var state = null;
  var me = null; // signed-in person: { email, rep, role }
  // Reps who have left: hidden from the live tabs and summary, but their entries stay in History.
  var RETIRED = ['Jules', 'Erich'];
  var horizons = {};
  var active = 'summary';
  try { active = sessionStorage.getItem('bdr-active-tab') || 'summary'; } catch (err) {}
  function remember(id) { try { sessionStorage.setItem('bdr-active-tab', id); } catch (err) {} }

  // Connect outcomes — JF disposition codes (SOP 4a). Discovery Booked is the `booked` field.
  //   rate  — carries a % of connects (every code that comes out of the connects does)
  //   split — comes out of the day's connects, so it counts toward the remainder
  //   group — which block of the log form it sits in
  // MR is neither: a rebook is not a new booking and not a fresh connect, so it is just a counter.
  // DNC and Wrong Number are not tracked at all — they land in "other".
  var DISP = [
    { k: 'disp_al',   id: 'o-al',   code: 'AL',   label: 'Activated Lead',           rate: true,  split: true,  group: 'mix' },
    { k: 'disp_ci',   id: 'o-ci',   code: 'CI',   label: 'Connect Incomplete',       rate: true,  split: true,  group: 'mix' },
    { k: 'disp_nn',   id: 'o-nn',   code: 'NN',   label: 'Not Now',                  rate: true,  split: true,  group: 'mix' },
    { k: 'disp_ni',   id: 'o-ni',   code: 'NI',   label: 'Not Interested',           rate: true,  split: true,  group: 'mix' },
    { k: 'disp_nm',   id: 'o-nm',   code: 'NM',   label: 'Not Me',                   rate: true,  split: true,  group: 'dq' },
    { k: 'disp_nlwc', id: 'o-nlwc', code: 'NLWC', label: 'No Longer With Company',   rate: true,  split: true,  group: 'dq' },
    { k: 'disp_nisl', id: 'o-nisl', code: 'NISL', label: 'Not in Swim Lane',         rate: true,  split: true,  group: 'dq' },
    { k: 'disp_ref',  id: 'o-ref',  code: 'REF',  label: 'Referred',                 rate: true,  split: true,  group: 'dq' },
    { k: 'disp_cst',  id: 'o-cst',  code: 'CST',  label: 'CST (moved to CST offer)', rate: true,  split: true,  group: 'dq' },
    { k: 'disp_mr',   id: 'o-mr',   code: 'MR',   label: 'Meeting Rebook',           rate: false, split: false, group: 'sep' }
  ];
  var SPLIT = DISP.filter(function (d) { return d.split; });

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function f0(x) { return Math.round(x).toLocaleString(); }
  function f1(x) { return (Math.round(x * 10) / 10).toLocaleString(undefined, { minimumFractionDigits: 1 }); }
  function pct(n, d) { return d > 0 ? f1(n / d * 100) + '%' : '&mdash;'; }
  function iso(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function parse(v) { var p = v.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function workdays(a, b) {
    if (a > b) return 0;
    var n = 0, d = new Date(a);
    for (; d <= b; d.setDate(d.getDate() + 1)) { var w = d.getDay(); if (w !== 0 && w !== 6) n++; }
    return n;
  }
  function has(v) { return v !== null && v !== undefined && v !== ''; }
  function val(id) { var el = document.getElementById(id); return el ? Number(el.value || 0) : 0; }

  function monthWindow() {
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth(), 1);
    var end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var total = workdays(start, end);
    var elapsed = workdays(start, today > end ? end : today);
    return { start: start, end: end, total: total, elapsed: Math.min(elapsed, total), remaining: total - Math.min(elapsed, total) };
  }

  function sum(rows, k) { return rows.reduce(function (a, r) { return a + Number(r[k] || 0); }, 0); }

  function settingsFor(rep) {
    return state.settings.concat(state.retired || []).find(function (s) { return s.rep === rep; }) || {};
  }
  function entryFor(rep, dateStr) {
    return state.entries.find(function (e) { return e.rep === rep && e.entry_date === dateStr; });
  }

  // The rates each rep SET for themselves — these drive all the math.
  function ratesFor(rep) {
    var s = settingsFor(rep);
    var d2c = Number(s.rate_d2c || 10) / 100;
    var comp = Number(s.rate_comp || 49) / 100;
    var book = Number(s.rate_book || 53) / 100;
    return { d2c: d2c, comp: comp, book: book,
      dialsPerBooking: (d2c > 0 && comp > 0 && book > 0) ? 1 / (d2c * comp * book) : 0 };
  }

  // What this rep's own logged history says — shown as reference only.
  function loggedRates(rep) {
    var rows = state.entries.filter(function (e) { return e.rep === rep; });
    var d = sum(rows, 'dials'), c = sum(rows, 'connects'), cp = sum(rows, 'completions'), b = sum(rows, 'booked');
    return {
      d2c: d > 0 ? c / d * 100 : null,
      comp: c > 0 ? cp / c * 100 : null,
      book: cp > 0 ? b / cp * 100 : null
    };
  }

  // Split a set of days into the outcome codes + booked, and whatever is left over.
  // "Other" is everything the codes do not name (DNC / Wrong Number — deliberately untracked)
  // plus any connects the rep has not categorised yet — it is never hidden.
  function outcomeMix(rows) {
    var o = {
      connects: sum(rows, 'connects'), convos: sum(rows, 'completions'),
      booked: sum(rows, 'booked'), counts: {}, split: 0
    };
    DISP.forEach(function (d) {
      o.counts[d.k] = sum(rows, d.k);
      if (d.split) o.split += o.counts[d.k];
    });
    o.categorized = o.split + o.booked;
    o.other = o.connects - o.categorized;
    // The two conversion rates that matter: how much of a connect, and of a real conversation,
    // turns into a discovery on the calendar.
    o.connectToDB = o.connects > 0 ? o.booked / o.connects * 100 : null;
    o.convoToDB = o.convos > 0 ? o.booked / o.convos * 100 : null;
    return o;
  }

  function compute(rep) {
    var mw = monthWindow();
    var s = settingsFor(rep);
    var target = s.monthly_target || 48;
    var mtd = state.entries.filter(function (e) {
      return e.rep === rep && parse(e.entry_date) >= mw.start && parse(e.entry_date) <= mw.end;
    });
    var booked = sum(mtd, 'booked'), dials = sum(mtd, 'dials');
    var loggedDays = mtd.filter(function (e) {
      return Number(e.dials) > 0 || Number(e.connects) > 0 || Number(e.completions) > 0 || Number(e.booked) > 0;
    }).length;
    var rates = ratesFor(rep);
    var pace = mw.total ? target * mw.elapsed / mw.total : 0;
    var behind = pace - booked;
    var dailyBookTarget = mw.total ? target / mw.total : 0;

    // Commitment adherence — only days where a commitment was actually set count as a denominator.
    var cd = mtd.filter(function (e) { return has(e.commit_dials); });
    var cb = mtd.filter(function (e) { return has(e.commit_booked); });
    // What the rates alone would ask for, then the floor. A rep converting well can "earn" a
    // 300-dial day on paper; the 780 minimum overrides that.
    var stdRaw = dailyBookTarget * rates.dialsPerBooking;
    return {
      mw: mw, target: target, mtd: mtd, booked: booked, dials: dials, rates: rates,
      pace: pace, behind: behind,
      onPace: behind <= 0.001,
      dailyBookTarget: dailyBookTarget,
      stdDialsRaw: stdRaw,
      floored: stdRaw < DIAL_FLOOR,
      stdDialsDay: Math.max(stdRaw, DIAL_FLOOR),
      dialDebt: Math.max(0, behind) * rates.dialsPerBooking,
      cushionDials: Math.max(0, -behind) * rates.dialsPerBooking,
      loggedDays: loggedDays,
      curDialsDay: loggedDays > 0 ? dials / loggedDays : 0,
      mix: outcomeMix(mtd),
      commitDialDays: cd.length,
      commitDialKept: cd.filter(function (e) { return Number(e.dials) >= Number(e.commit_dials); }).length,
      commitDialsSet: sum(cd, 'commit_dials'),
      commitDialsDone: sum(cd, 'dials'),
      commitBookDays: cb.length,
      commitBookKept: cb.filter(function (e) { return Number(e.booked) >= Number(e.commit_booked); }).length
    };
  }

  function api(path, body) {
    return fetch(BASE + path, body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : undefined
    ).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function load() {
    return api('/api/state').then(function (s) {
      s.retired = s.settings.filter(function (x) { return RETIRED.indexOf(x.rep) !== -1; });
      s.settings = s.settings.filter(function (x) { return RETIRED.indexOf(x.rep) === -1; });
      state = s;
      // List data + who I am are extras: if they fail the rest of the tracker still works.
      return Promise.all([
        api('/api/lists').then(function (l) { state.lists = l; }).catch(function (e) { state.lists = null; state.listsErr = e.message; }),
        me ? null : fetch('/auth/me').then(function (r) { return r.json(); }).then(function (u) { me = u; }).catch(function () {})
      ]).then(render);
    })
      .catch(function (e) {
        document.getElementById('view').innerHTML =
          '<div class="loading">Could not load data (' + esc(e.message) + '). <button class="ghost" onclick="location.reload()">Retry</button></div>';
      });
  }

  function renderTabs() {
    var el = document.getElementById('tabs');
    el.innerHTML = '';
    function mk(id, label) {
      var b = document.createElement('button');
      b.className = 'tab' + (active === id ? ' active' : '');
      b.textContent = label;
      b.onclick = function () { active = id; remember(id); render(); };
      el.appendChild(b);
    }
    mk('summary', 'Team Summary');
    mk('history', 'History');
    state.settings.forEach(function (s) { mk(s.rep, s.rep); });
  }

  function renderSummary(v) {
    var mw = monthWindow();
    var today = iso(new Date());
    var computed = state.settings.map(function (s) { return { rep: s.rep, c: compute(s.rep) }; });

    var paceRows = computed.map(function (x) {
      var c = x.c;
      var missing = c.loggedDays < mw.elapsed;
      var t = entryFor(x.rep, today);
      var cDials = t && has(t.commit_dials) ? Number(t.commit_dials) : null;
      var cCalls = t && has(t.commit_booked) ? Number(t.commit_booked) : null;
      var commitCell = (cDials === null && cCalls === null)
        ? "<td class='warn'>&mdash;<span class='pctu'>not set</span></td>"
        : "<td class='" + (cDials !== null && cDials < DIAL_FLOOR ? 'warn' : '') + "'>"
            + (cDials === null ? '&mdash;' : f0(cDials))
            + "<span class='pctu'>" + (cCalls === null ? 'no calls' : f1(cCalls) + ' calls') + '</span></td>';
      var keptClass = c.commitDialDays === 0 ? 'dim' : (c.commitDialKept === c.commitDialDays ? 'good' : 'warn');
      var keptCell = "<td class='" + keptClass + "'>" + c.commitDialKept + ' / ' + c.commitDialDays
        + "<span class='pctu'>" + (c.commitBookDays === 0 ? 'no call commits' : c.commitBookKept + ' / ' + c.commitBookDays + ' calls') + '</span></td>';
      return '<tr><td>' + esc(x.rep) + '</td><td>' + f0(c.target) + '</td><td>' + f1(c.booked)
        + '</td><td>' + f1(c.pace) + '</td><td>' + f1(c.behind)
        + "</td><td style='text-align:center'><span class='pill " + (c.onPace ? "good'>On pace" : "bad'>Behind") + '</span></td>'
        + "<td class='req'>" + f0(c.dialDebt) + '</td>'
        + '<td>' + f0(c.stdDialsDay) + (c.floored ? "<span class='pctu'>floor</span>" : '') + '</td>'
        + '<td>' + (c.loggedDays > 0 ? f0(c.curDialsDay) : '&mdash;') + '</td>'
        + commitCell + keptCell
        + "<td class='" + (missing ? 'warn' : '') + "'>" + c.loggedDays + ' / ' + mw.elapsed
        + '</td><td>' + f0(c.rates.dialsPerBooking) + '</td></tr>';
    }).join('');

    // Count over its share of connects, in one cell — nine codes each needing a % would be
    // eighteen columns otherwise.
    function cell(n, connects, cls) {
      return "<td class='" + (cls || '') + "'>" + f1(n)
        + "<span class='pctu'>" + pct(n, connects) + '</span></td>';
    }

    var mixRows = computed.map(function (x) {
      var m = x.c.mix;
      return '<tr><td>' + esc(x.rep) + '</td><td>' + f0(m.connects) + '</td><td>' + f0(m.convos) + '</td>'
        + "<td class='req'>" + f1(m.booked) + '</td>'
        + "<td class='req'>" + (m.connectToDB === null ? '&mdash;' : f1(m.connectToDB) + '%') + '</td>'
        + "<td class='req'>" + (m.convoToDB === null ? '&mdash;' : f1(m.convoToDB) + '%') + '</td>'
        + SPLIT.map(function (d) { return cell(m.counts[d.k], m.connects); }).join('')
        + cell(m.other, m.connects, m.other < -0.05 ? 'warn' : 'dim')
        + "<td class='dim'>" + f0(m.counts.disp_mr) + '</td></tr>';
    }).join('');

    var mixHead = SPLIT.map(function (d) { return '<th>' + d.code + '</th>'; }).join('');

    v.innerHTML = "<div class='card'><h2>All reps &mdash; month to date</h2><div class='tablewrap'><table>"
      + '<thead><tr><th>Rep</th><th>Target</th><th>Meetings booked</th><th>Pace</th><th>Behind</th>'
      + "<th style='text-align:center'>Status</th><th>Dial debt</th><th>Standard dials/day</th><th>Current dials/day</th>"
      + "<th>Today's commit</th><th>Commits kept</th><th>Days logged</th><th>Dials per booking</th></tr></thead>"
      + '<tbody>' + paceRows + '</tbody></table></div>'
      + "<ul class='defs'>"
      + '<li><strong>Pace / Behind</strong> &mdash; where the month says they should be by today (target &times; share of working days gone), and how many meetings they are short of it.</li>'
      + '<li><strong>Dial debt</strong> &mdash; the shortfall converted into dials: meetings behind &times; their dials per booking. This is the catch-up work they owe on top of a standard day. It shrinks with every meeting booked and grows every day they coast.</li>'
      + '<li><strong>Standard dials/day</strong> &mdash; what a normal day must look like to hit the monthly target: daily meetings target &times; dials per booking, or the <strong>' + f0(DIAL_FLOOR) + '-dial team minimum</strong> if the rate math asks for less. Marked <em>floor</em> when the minimum is what is showing &mdash; a rep converting well still owes the ' + f0(DIAL_FLOOR) + '.</li>'
      + '<li><strong>Current dials/day</strong> &mdash; how hard they actually dial on the days they logged (total dials &divide; days logged). Not diluted by missing days.</li>'
      + "<li><strong>Today's commit</strong> &mdash; what they committed to this morning: dials on top, calls underneath. Red means no commitment set today, or a dial commitment under the " + f0(DIAL_FLOOR) + ' minimum.</li>'
      + '<li><strong>Commits kept</strong> &mdash; days they hit their own committed number, out of the days they set one: dials on top, calls underneath. Days with no commitment are not counted either way.</li>'
      + '<li><strong>Days logged</strong> &mdash; days with any activity entered vs working days elapsed this month. Red means gaps: the other columns understate reality until those days are backfilled.</li>'
      + '<li><strong>Dials per booking</strong> &mdash; how many dials one booked meeting costs at the rates that rep set on their own tab (their connect, conversation, and booking rates &mdash; no team averages).</li>'
      + '</ul></div>'

      + "<div class='card'><h2>What the connects turned into &mdash; month to date</h2><div class='tablewrap'><table>"
      + "<thead><tr><th>Rep</th><th>Connects</th><th>Convos</th><th>Booked (DB)</th>"
      + '<th>Connect&rarr;DB</th><th>Convo&rarr;DB</th>' + mixHead
      + "<th>Other</th><th class='dim'>MR</th></tr></thead>"
      + '<tbody>' + mixRows + '</tbody></table></div>'
      + "<ul class='defs'>"
      + '<li><strong>Every outcome cell shows the count with its share of that rep&rsquo;s connects underneath</strong> &mdash; one denominator across the whole row, printed in the Connects column so nothing hides behind a percentage. Read across a row and you have the full breakdown of what that rep&rsquo;s calls turned into.</li>'
      + '<li><strong>Connect&rarr;DB</strong> &mdash; discoveries booked &divide; connects. <strong>Convo&rarr;DB</strong> &mdash; discoveries booked &divide; conversations (the 30-second ones).</li>'
      + '<li><strong>The mix we manage against</strong> &mdash; <strong>AL</strong> Activated Lead &middot; <strong>CI</strong> Connect Incomplete &middot; <strong>NN</strong> Not Now &middot; <strong>NI</strong> Not Interested.</li>'
      + '<li><strong>Disqualified / redirected</strong> &mdash; <strong>NM</strong> Not Me &middot; <strong>NLWC</strong> No Longer With Company &middot; <strong>NISL</strong> Not in Swim Lane &middot; <strong>REF</strong> Referred &middot; <strong>CST</strong> moved to the CST offer. High percentages here are a list-quality problem, not a rep problem.</li>'
      + '<li><strong>MR</strong> (Meeting Rebook) is a count with no percentage, and sits outside the split entirely &mdash; a rebooked meeting is not a new discovery booked, it is just worth knowing how many happened.</li>'
      + '<li><strong>Other</strong> &mdash; connects minus booked and the nine codes. It holds the two outcomes we deliberately do not track (Do Not Contact, Wrong Number) plus anything not yet filled in. A negative number means the outcomes entered exceed the connects entered &mdash; a logging error worth chasing.</li>'
      + '</ul>'
      + "<p class='hint'>Refresh the page to pull the latest entries.</p></div>";
  }

  // ---- History: any week, month or quarter, with a trend of the periods leading up to it ----
  var hist = { kind: 'week', offset: 0, metric: 'booked' };
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var HIST_METRICS = [
    { k: 'booked', label: 'Meetings booked' }, { k: 'dials', label: 'Dials' },
    { k: 'connects', label: 'Connects' }, { k: 'completions', label: 'Conversations' }
  ];

  function wk(d) { return d.getDay() !== 0 && d.getDay() !== 6; }
  // Which period (as an offset from today's) contains this date.
  function offsetFor(kind, ds) {
    var d = parse(ds), now = new Date(); now.setHours(0, 0, 0, 0);
    if (d >= now) return 0;
    if (kind === 'day') {
      var n = 0;
      for (var c = new Date(now); iso(c) > ds;) { c.setDate(c.getDate() - 1); if (wk(c) && iso(c) >= ds) n--; }
      return n;
    }
    if (kind === 'week') {
      var mn = function (x) { var m = new Date(x); m.setHours(0, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; };
      return -Math.round((mn(now) - mn(d)) / (7 * 864e5));
    }
    if (kind === 'month') return (d.getFullYear() - now.getFullYear()) * 12 + d.getMonth() - now.getMonth();
    return (d.getFullYear() * 4 + Math.floor(d.getMonth() / 3)) - (now.getFullYear() * 4 + Math.floor(now.getMonth() / 3));
  }

  function periodFor(kind, offset) {
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var s, e, label, short;
    if (kind === 'day') {
      s = new Date(now);
      for (var n = offset; n < 0;) { s.setDate(s.getDate() - 1); if (wk(s)) n++; }
      e = new Date(s);
      label = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][s.getDay()] + ', ' + MON[s.getMonth()] + ' ' + s.getDate() + ', ' + s.getFullYear();
      short = MON[s.getMonth()] + ' ' + s.getDate();
    } else if (kind === 'week') {
      s = new Date(now); s.setDate(s.getDate() - ((s.getDay() + 6) % 7) + offset * 7);
      e = new Date(s); e.setDate(e.getDate() + 6);
      label = MON[s.getMonth()] + ' ' + s.getDate() + ' – ' + MON[e.getMonth()] + ' ' + e.getDate() + ', ' + e.getFullYear();
      short = MON[s.getMonth()] + ' ' + s.getDate();
    } else if (kind === 'month') {
      s = new Date(now.getFullYear(), now.getMonth() + offset, 1);
      e = new Date(s.getFullYear(), s.getMonth() + 1, 0);
      label = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][s.getMonth()] + ' ' + s.getFullYear();
      short = MON[s.getMonth()] + " '" + String(s.getFullYear()).slice(2);
    } else {
      var q = Math.floor(now.getMonth() / 3);
      s = new Date(now.getFullYear(), q * 3 + offset * 3, 1);
      e = new Date(s.getFullYear(), s.getMonth() + 3, 0);
      label = 'Q' + (Math.floor(s.getMonth() / 3) + 1) + ' ' + s.getFullYear();
      short = 'Q' + (Math.floor(s.getMonth() / 3) + 1) + " '" + String(s.getFullYear()).slice(2);
    }
    return { start: s, end: e, from: iso(s), to: iso(e), label: label, short: short, workdays: workdays(s, e) };
  }

  function rowsIn(rep, p) {
    var known = state.settings.concat(state.retired || []).map(function (s) { return s.rep; });
    return state.entries.filter(function (e) {
      return (rep === null ? known.indexOf(e.rep) !== -1 : e.rep === rep) && e.entry_date >= p.from && e.entry_date <= p.to;
    });
  }

  // Monthly target spread over the period: each month it touches contributes its share of working days.
  // Uses each rep's current target (past targets are not stored).
  function targetFor(rep, p) {
    var target = settingsFor(rep).monthly_target || 48, total = 0;
    var m = new Date(p.start.getFullYear(), p.start.getMonth(), 1);
    for (; m <= p.end; m.setMonth(m.getMonth() + 1)) {
      var ms = new Date(m), me = new Date(m.getFullYear(), m.getMonth() + 1, 0);
      var a = ms < p.start ? p.start : ms, b = me > p.end ? p.end : me;
      var mDays = workdays(ms, me);
      if (mDays) total += target * workdays(a, b) / mDays;
    }
    return total;
  }

  function renderHistory(v) {
    var p = periodFor(hist.kind, hist.offset);
    var today = iso(new Date());
    var elapsedEnd = p.to > today ? parse(today) : p.end;
    var elapsedDays = p.from > today ? 0 : workdays(p.start, elapsedEnd);
    var metric = HIST_METRICS.find(function (m) { return m.k === hist.metric; });

    var kinds = [['day', 'Day'], ['week', 'Week'], ['month', 'Month'], ['quarter', 'Quarter']].map(function (k) {
      return "<button data-kind='" + k[0] + "' class='" + (hist.kind === k[0] ? 'on' : '') + "'>" + k[1] + '</button>';
    }).join('');
    var metrics = HIST_METRICS.map(function (m) {
      return "<button data-metric='" + m.k + "' class='" + (hist.metric === m.k ? 'on' : '') + "'>" + m.label + '</button>';
    }).join('');

    // trend: this period and the seven before it, team total
    var cols = [], max = 0, i;
    for (i = 7; i >= 0; i--) {
      var q = periodFor(hist.kind, hist.offset - i);
      var tot = sum(rowsIn(null, q), hist.metric);
      max = Math.max(max, tot);
      cols.push({ off: hist.offset - i, p: q, tot: tot });
    }
    var trend = cols.map(function (c) {
      var h = max > 0 ? Math.round(c.tot / max * 100) : 0;
      return "<div class='col" + (c.off === hist.offset ? ' sel' : '') + "' data-off='" + c.off + "' title='" + esc(c.p.label) + "'>"
        + "<div class='n'>" + f0(c.tot) + '</div><div class="bar" style="height:' + h + '%"></div>'
        + "<div class='l'>" + esc(c.p.short) + '</div></div>';
    }).join('');

    function cell(n, connects, cls) {
      return "<td class='" + (cls || '') + "'>" + f1(n) + "<span class='pctu'>" + pct(n, connects) + '</span></td>';
    }
    var reps = state.settings.map(function (s) { return s.rep; });
    var groups = reps.map(function (r) { return { name: r, rows: rowsIn(r, p), target: targetFor(r, p) }; });
    // former reps appear only in periods where they actually have entries
    (state.retired || []).forEach(function (s) {
      var rows = rowsIn(s.rep, p);
      if (rows.length) groups.push({ name: s.rep + ' (former)', rows: rows, target: targetFor(s.rep, p) });
    });
    var all = { name: 'Team', rows: rowsIn(null, p), target: groups.reduce(function (a, g) { return a + g.target; }, 0) };

    function logged(rows) {
      return rows.filter(function (e) { return Number(e.dials) > 0 || Number(e.connects) > 0 || Number(e.completions) > 0 || Number(e.booked) > 0; }).length;
    }
    var perf = groups.concat([all]).map(function (g) {
      var m = outcomeMix(g.rows), d = sum(g.rows, 'dials');
      var isTeam = g.name === 'Team';
      var pctT = g.target > 0 ? m.booked / g.target * 100 : null;
      return '<tr' + (isTeam ? " class='total'" : '') + '><td>' + esc(g.name) + '</td><td>' + f0(d) + '</td><td>' + f0(m.connects) + '</td><td>' + f0(m.convos)
        + "</td><td class='req'>" + f1(m.booked) + '</td><td>' + f1(g.target)
        + "</td><td class='" + (pctT === null ? 'dim' : (pctT >= 100 ? 'good' : '')) + "'>" + (pctT === null ? '&mdash;' : f0(pctT) + '%') + '</td>'
        + '<td>' + (d > 0 ? f1(m.connects / d * 100) + '%' : '&mdash;') + '</td>'
        + '<td>' + (m.connectToDB === null ? '&mdash;' : f1(m.connectToDB) + '%') + '</td>'
        + '<td>' + (isTeam ? '' : logged(g.rows) + ' / ' + elapsedDays) + '</td></tr>';
    }).join('');

    var mix = groups.concat([all]).map(function (g) {
      var m = outcomeMix(g.rows);
      return '<tr' + (g.name === 'Team' ? " class='total'" : '') + '><td>' + esc(g.name) + '</td><td>' + f0(m.connects) + '</td>'
        + "<td class='req'>" + f1(m.booked) + '</td>'
        + SPLIT.map(function (d) { return cell(m.counts[d.k], m.connects); }).join('')
        + cell(m.other, m.connects, m.other < -0.05 ? 'warn' : 'dim')
        + "<td class='dim'>" + f0(m.counts.disp_mr) + '</td></tr>';
    }).join('');

    v.innerHTML = "<div class='card'><h2>History</h2>"
      + "<div class='hbar'><span class='seg' id='h-kind'>" + kinds + '</span>'
      + "<button class='ghost' id='h-prev'>&larr;</button><span class='label'>" + esc(p.label) + '</span>'
      + "<button class='ghost' id='h-next'" + (hist.offset >= 0 ? ' disabled' : '') + ">&rarr;</button>"
      + "<input type='date' id='h-date' value='" + p.from + "' max='" + today + "' style='width:150px'></div>"
      + "<div style='margin-top:10px'><span class='seg' id='h-metric'>" + metrics + '</span></div>'
      + "<div class='trend' id='h-trend'>" + trend + '</div></div>'

      + "<div class='card'><h2>All reps &mdash; " + esc(p.label) + "</h2><div class='tablewrap'><table>"
      + '<thead><tr><th>Rep</th><th>Dials</th><th>Connects</th><th>Convos</th><th>Booked</th><th>Target</th><th>% of target</th>'
      + '<th>Dial&rarr;connect</th><th>Connect&rarr;DB</th><th>Days logged</th></tr></thead><tbody>' + perf + '</tbody></table></div>'
      + "<ul class='defs'><li><strong>Target</strong> &mdash; each rep&rsquo;s monthly target spread over the working days in the period. It uses their current target, since past targets are not stored.</li>"
      + '<li><strong>Days logged</strong> &mdash; days with any activity entered, out of working days elapsed in the period. Gaps mean the totals understate that period.</li></ul></div>'

      + "<div class='card'><h2>What the connects turned into &mdash; " + esc(p.label) + "</h2><div class='tablewrap'><table>"
      + '<thead><tr><th>Rep</th><th>Connects</th><th>Booked (DB)</th>' + SPLIT.map(function (d) { return '<th>' + d.code + '</th>'; }).join('')
      + "<th>Other</th><th class='dim'>MR</th></tr></thead><tbody>" + mix + '</tbody></table></div></div>';

    function go() { render(); }
    Array.prototype.forEach.call(v.querySelectorAll('#h-kind button'), function (b) {
      b.onclick = function () { hist.kind = b.getAttribute('data-kind'); hist.offset = 0; go(); };
    });
    Array.prototype.forEach.call(v.querySelectorAll('#h-metric button'), function (b) {
      b.onclick = function () { hist.metric = b.getAttribute('data-metric'); go(); };
    });
    Array.prototype.forEach.call(v.querySelectorAll('#h-trend .col'), function (c) {
      c.onclick = function () { hist.offset = Number(c.getAttribute('data-off')); go(); };
    });
    document.getElementById('h-prev').onclick = function () { hist.offset--; go(); };
    document.getElementById('h-next').onclick = function () { if (hist.offset < 0) { hist.offset++; go(); } };
    document.getElementById('h-date').onchange = function () { if (this.value) { hist.offset = offsetFor(hist.kind, this.value); go(); } };
  }

  function renderRep(v, rep) {
    var c = compute(rep);
    var s = settingsFor(rep);
    var lg = loggedRates(rep);
    var today = iso(new Date());
    var todayEntry = entryFor(rep, today);
    var horizon = Math.max(1, Math.round(horizons[rep] || c.mw.remaining || 1));
    var extraPerDay = c.dialDebt / horizon;
    var totalPerDay = c.stdDialsDay + extraPerDay;

    var dayList = [];
    (function () {
      var t = new Date(); t.setHours(0, 0, 0, 0);
      var stop = t > c.mw.end ? c.mw.end : t;
      for (var d = new Date(c.mw.start); d <= stop; d.setDate(d.getDate() + 1)) {
        var w = d.getDay(); if (w !== 0 && w !== 6) dayList.push(iso(d));
      }
      dayList.reverse();
    })();

    var dayRows = dayList.map(function (ds) {
      var e = c.mtd.find(function (x) { return x.entry_date === ds; });
      var logged = e && (Number(e.dials) > 0 || Number(e.connects) > 0 || Number(e.completions) > 0 || Number(e.booked) > 0);
      var commitCell = e && has(e.commit_dials)
        ? "<td class='" + (logged ? (Number(e.dials) >= Number(e.commit_dials) ? 'good' : 'warn') : 'dim') + "'>" + f0(e.commit_dials) + '</td>'
        : "<td class='dim'>&mdash;</td>";
      var body = logged
        ? '<td>' + f0(e.dials) + '</td><td>' + f0(e.connects) + '</td><td>' + f0(e.completions) + '</td><td>' + f1(e.booked) + '</td>'
          + DISP.map(function (d) { return "<td class='dim'>" + f0(e[d.k]) + '</td>'; }).join('')
        : "<td colspan='14' style='text-align:left;color:var(--muted)'>not logged &mdash; click to backfill</td>";
      return "<tr class='clickable' data-date='" + ds + "'><td>" + ds + '</td>' + commitCell + body + '</tr>';
    }).join('');

    function rateRow(label, id, value, logged) {
      return "<div class='row'><span>" + label + '</span>'
        + "<span style='display:flex;align-items:center;gap:8px'>"
        + "<span class='ref'>" + (logged === null ? 'your log: &mdash;' : 'your log: ' + f1(logged) + '%') + '</span>'
        + "<input type='number' min='0.5' max='100' step='0.5' id='" + id + "' value='" + Number(value) + "' style='width:82px'> %"
        + '</span></div>';
    }

    // ---- commitment card -------------------------------------------------
    var todayDials = todayEntry ? Number(todayEntry.dials) : 0;
    var todayBooked = todayEntry ? Number(todayEntry.booked) : 0;
    var hasCommitD = todayEntry && has(todayEntry.commit_dials);
    var hasCommitB = todayEntry && has(todayEntry.commit_booked);
    var commitStat;
    if (!hasCommitD && !hasCommitB) {
      commitStat = "<div class='v' style='color:var(--bad);font-size:19px'>Not set</div><div class='sub'>Set it before you start dialling</div>";
    } else {
      var dialsLeft = hasCommitD ? Number(todayEntry.commit_dials) - todayDials : 0;
      var callsLeft = hasCommitB ? Number(todayEntry.commit_booked) - todayBooked : 0;
      var sm = "<span style='font-size:15px;color:var(--muted)'>";
      commitStat = "<div class='v' style='font-size:21px'>"
        + (hasCommitD ? f0(todayEntry.commit_dials) + ' ' + sm + 'dials</span>' : '')
        + (hasCommitD && hasCommitB ? ' ' + sm + '&middot;</span> ' : '')
        + (hasCommitB ? f1(todayEntry.commit_booked) + ' ' + sm + 'calls</span>' : '')
        + '</div>'
        + "<div class='sub'>"
        + (hasCommitD ? f0(todayDials) + ' dialled &middot; '
            + (dialsLeft > 0 ? f0(dialsLeft) + ' to go' : "<span style='color:var(--good)'>kept</span>") : '')
        + (hasCommitD && hasCommitB ? '<br>' : '')
        + (hasCommitB ? f1(todayBooked) + ' booked &middot; '
            + (callsLeft > 0 ? f1(callsLeft) + ' to go' : "<span style='color:var(--good)'>kept</span>") : '')
        + '</div>';
    }

    var commitCard = "<div class='card'><h2>Today's commitment &mdash; set it this morning</h2>"
      + "<div class='row'><label for='c-date'>For</label><input type='date' id='c-date' value='" + today + "'></div>"
      + "<div class='row'><label for='c-dials'>Dials I commit to</label><input type='number' min='0' step='10' id='c-dials' value='"
        + (hasCommitD ? Number(todayEntry.commit_dials) : '') + "'></div>"
      + "<div class='row'><label for='c-booked'>Calls I commit to booking</label><input type='number' min='0' step='0.5' id='c-booked' value='"
        + (hasCommitB ? Number(todayEntry.commit_booked) : '') + "'></div>"
      + "<div class='recon' id='c-floor'></div>"
      + "<div class='row' style='justify-content:space-between'>"
      + "<span class='hint' style='margin:0'>Suggested: " + f0(totalPerDay) + ' dials</span>'
      + "<button class='btn' id='c-save'>Commit</button></div>"

      + '</tr></thead><tbody>'

    // ---- reconciliation: do the outcomes account for the connects? -------
    function recon() {
      var el = document.getElementById('e-recon');
      var connects = val('e-connects');
      var categorized = val('e-booked')
        + DISP.reduce(function (a, d) { return a + (d.split ? val(d.id) : 0); }, 0);
      var other = connects - categorized;
      el.className = 'recon' + (other < -0.05 ? ' bad' : (connects > 0 && Math.abs(other) < 0.05 ? ' good' : ''));
      if (connects === 0 && categorized === 0) {
        el.innerHTML = 'Enter your connects and split them by outcome.';
      } else if (other < -0.05) {
        el.innerHTML = 'Outcomes add up to ' + f1(categorized) + ' but you logged ' + f0(connects)
          + ' connects &mdash; ' + f1(-other) + ' too many. Fix one or the other before saving.';
      } else {
        el.innerHTML = f1(categorized) + ' of ' + f0(connects) + ' connects categorised &middot; '
          + f1(other) + ' other / not categorised'
          + (other > 0.05 ? ' (Do Not Contact, Wrong Number &mdash; or still to fill in)' : '');
      }
    }

    function fillForm(dateStr) {
      var e = entryFor(rep, dateStr);
      document.getElementById('e-dials').value = e ? e.dials : '';

      document.getElementById('e-completions').value = e ? e.completions : '';
      document.getElementById('e-booked').value = e ? e.booked : '';
      DISP.forEach(function (d) { document.getElementById(d.id).value = e ? e[d.k] : ''; });
      recon();
    }
    fillForm(today);
    document.getElementById('e-date').onchange = function () { fillForm(this.value); };
    ['e-connects', 'e-booked'].concat(DISP.map(function (d) { return d.id; })).forEach(function (id) {

    });

    v.querySelectorAll('tr.clickable').forEach(function (tr) {

      }).then(function () { toast('Commitment saved'); return load(); })

    // The 780 floor is a hard minimum, not a suggestion — say so while they type it.
    function floorCheck() {
      var el = document.getElementById('c-floor');

      var n = Number(v);
      if (n < DIAL_FLOOR) {

  // ---------- Lists tab: which tier lists each BDR dialed, and why not ----------
  // Dials per list come from the weekly Nooks upload (same data as the RevOps L10 "Lists not dialed").
  // A week belongs to the month its Monday falls in. Reasons are saved per rep + month + list.
  var lv = { kind: 'month', offset: 0 };
  var WHY_OPTS = ['List was empty', 'Nooks tasks not loaded', 'Ran out of time', 'Prioritized other lists', 'Blocked / tool issue', 'Out of office'];
  function mondayOf(we) { var d = parse(we); d.setDate(d.getDate() - 5); return d; }
  function monthKey(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function shortDate(d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function listPeriod() {
    var weeks = [];
    state.lists.rows.forEach(function (r) { if (weeks.indexOf(r.week_ending) === -1) weeks.push(r.week_ending); });
    weeks.sort().reverse();
    if (!weeks.length) return null;
    var items;
    if (lv.kind === 'week') {
      items = weeks.map(function (we) {
        var m = mondayOf(we);
        return { key: monthKey(m), label: shortDate(m) + ' – ' + shortDate(parse(we)), weeks: [we] };
      });
    } else {
      items = [];
      weeks.forEach(function (we) {
        var k = monthKey(mondayOf(we));
        var it = items.find(function (x) { return x.key === k; });
        if (!it) {
          var p = k.split('-');
          it = { key: k, label: new Date(+p[0], +p[1] - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }), weeks: [] };
          items.push(it);
        }
        it.weeks.push(we);
      });
    }
    var i = Math.max(0, Math.min(lv.offset, items.length - 1));
    lv.offset = i;
    return { key: items[i].key, label: items[i].label, weeks: items[i].weeks, hasOlder: i < items.length - 1, hasNewer: i > 0 };
  }
  function noteFor(rep, key, tier, list) {
    var n = state.lists.notes.find(function (x) {
      return x.rep === rep && x.period_key === key && x.tier === tier && x.list_name === list;
    });
    return n ? n.note : '';
  }
  function canEditNotes(rep) { return !!me && (me.role === 'admin' || me.rep === rep); }

  function renderLists(host, mode, who) {
    var v = document.createElement('div');
    v.className = 'lists-sec';
    v.style.marginTop = '20px';
    host.appendChild(v);
    if (!state.lists) {
      v.innerHTML = '<div class="card"><h2>Lists</h2><p class="hint">Could not load list data' + (state.listsErr ? ' (' + esc(state.listsErr) + ')' : '') + '. Refresh to retry.</p></div>';
      return;
    }
    var P = listPeriod();
    if (!P) { v.innerHTML = '<div class="card"><h2>Lists</h2><p class="hint">No list data has been uploaded yet.</p></div>'; return; }
    var reps = state.settings.map(function (s) { return s.rep; });
    var shown = mode === 'rep' ? [who] : reps;
    var tl = state.lists.tierLists.slice().sort(function (a, b) { return a.tier.localeCompare(b.tier) || a.list_name.localeCompare(b.list_name); });
    var agg = {};
    state.lists.rows.forEach(function (r) {
      if (P.weeks.indexOf(r.week_ending) === -1) return;
      var k = r.bdr + '|' + r.tier + '|' + r.list_name;
      var a = agg[k] || (agg[k] = { d: 0, c: 0 });
      a.d += Number(r.dials || 0); a.c += Number(r.connects || 0);
    });
    // booked meetings per list (HubSpot, credited to the list the lead was dialed from); tier 'None' = no list tag
    var otherBooked = {};
    (state.lists.books || []).forEach(function (r) {
      if (P.weeks.indexOf(r.week_ending) === -1) return;
      var n = Number(r.outbound_books || 0);
      if (r.tier === 'None') { otherBooked[r.bdr] = (otherBooked[r.bdr] || 0) + n; return; }
      var a = agg[r.bdr + '|' + r.tier + '|' + r.list_name] || (agg[r.bdr + '|' + r.tier + '|' + r.list_name] = { d: 0, c: 0 });
      a.b = (a.b || 0) + n;
    });
    function dials(rep, l) { return (agg[rep + '|' + l.tier + '|' + l.list_name] || { d: 0 }).d; }
    function booked(rep, l) { return (agg[rep + '|' + l.tier + '|' + l.list_name] || {}).b || 0; }
    function bookedTotal(rep) {
      var t = otherBooked[rep] || 0;
      tl.forEach(function (l) { t += booked(rep, l); });
      return Math.round(t * 10) / 10;
    }
    var hasData = {};
    state.lists.rows.forEach(function (r) { if (P.weeks.indexOf(r.week_ending) !== -1) hasData[r.bdr] = true; });

    var bar = '<div class="ls-bar"><div class="seg">'
      + [['month', 'Month'], ['week', 'Week']].map(function (k) { return "<button data-kind='" + k[0] + "' class='" + (lv.kind === k[0] ? 'on' : '') + "'>" + k[1] + '</button>'; }).join('')
      + '</div><button class="ls-nav" id="ls-older" aria-label="Older"' + (P.hasOlder ? '' : ' disabled') + '>&lsaquo;</button>'
      + '<div class="label">' + esc(P.label) + '</div>'
      + '<button class="ls-nav" id="ls-newer" aria-label="Newer"' + (P.hasNewer ? '' : ' disabled') + '>&rsaquo;</button></div>';

    var tiles = '<div class="ls-sum">' + shown.map(function (r) {
      if (!hasData[r]) return '<div class="stat"><div class="k">' + esc(r) + '</div><div class="v">&mdash;</div><div class="sub">No upload for this period</div></div>';
      var missed = tl.filter(function (l) { return dials(r, l) === 0; });
      var t1 = missed.filter(function (l) { return l.tier === 'Tier 1'; }).length;
      return '<div class="stat"><div class="k">' + esc(r) + ' &mdash; lists dialed</div><div class="v">' + (tl.length - missed.length) + ' / ' + tl.length + '</div>'
        + '<div class="sub">' + bookedTotal(r) + ' meetings booked &middot; ' + (missed.length ? '<span class="pill bad">' + missed.length + ' not dialed' + (t1 ? ' (' + t1 + ' in Tier 1)' : '') + '</span>' : '<span class="pill good">Dialed every list</span>') + '</div></div>';
    }).join('') + '</div>';

    function cell(rep, l) {
      if (!hasData[rep]) return '<td class="dim">&mdash;</td>';
      var d = dials(rep, l), why = noteFor(rep, P.key, l.tier, l.list_name);
      var bk = booked(rep, l);
      return '<td>' + (d > 0 ? f0(d) : '<span class="nd">Not dialed</span>') + (bk ? '<span class="why" style="font-style:normal;color:var(--good);font-weight:600">' + bk + ' booked</span>' : '') + (why ? '<span class="why">' + esc(why) + '</span>' : '') + '</td>';
    }
    var grid = '<div class="card"><h2>Who dialed what &mdash; ' + esc(P.label) + '</h2><div class="tablewrap"><table class="grid"><thead><tr><th>List</th>'
      + reps.map(function (r) { return '<th>' + esc(r) + '</th>'; }).join('') + '</tr></thead><tbody>'
      + tl.map(function (l, i) {
        var head = (i === 0 || tl[i - 1].tier !== l.tier) ? '<tr><td class="tierhead" colspan="' + (reps.length + 1) + '">' + esc(l.tier) + '</td></tr>' : '';
        return head + '<tr><td>' + esc(l.list_name) + '</td>' + reps.map(function (r) { return cell(r, l); }).join('') + '</tr>';
      }).join('')
      + '</tbody></table></div><p class="hint">Dials per list from the weekly Nooks upload. Each BDR writes the reasons in their own tab; they show here for the whole team.</p></div>';

    var datalist = '<datalist id="why-opts">' + WHY_OPTS.map(function (o) { return '<option value="' + esc(o) + '">'; }).join('') + '</datalist>';

    var cards = shown.map(function (r) {
      if (!hasData[r]) return '';
      var ed = canEditNotes(r);
      var rows = tl.map(function (l, i) {
        var a = agg[r + '|' + l.tier + '|' + l.list_name] || { d: 0, c: 0 };
        var miss = a.d === 0, why = noteFor(r, P.key, l.tier, l.list_name);
        var head = (i === 0 || tl[i - 1].tier !== l.tier) ? '<tr><td class="tierhead" colspan="6">' + esc(l.tier) + '</td></tr>' : '';
        var input = '<input class="note' + (miss && !why && ed ? ' need' : '') + '" list="why-opts" maxlength="500" data-rep="' + esc(r) + '" data-tier="' + esc(l.tier) + '" data-list="' + esc(l.list_name) + '"'
          + ' value="' + esc(why) + '" placeholder="' + (ed ? (miss ? 'Why wasn’t this dialed?' : 'Optional note') : '') + '"' + (ed ? '' : ' disabled') + '>';
        return head + '<tr><td>' + esc(l.list_name) + '</td><td>' + f0(a.d) + '</td><td>' + (a.d ? pct(a.c, a.d) : '&mdash;') + '</td>'
          + '<td>' + (booked(r, l) || '0') + '</td><td><span class="st ' + (miss ? 'miss' : 'ok') + '">' + (miss ? 'Not dialed' : 'Dialed') + '</span></td><td class="whycell">' + input + '</td></tr>';
      }).join('');
      return '<div class="card"><h2>' + esc(r) + ' &mdash; ' + esc(P.label) + '</h2><div class="tablewrap"><table><thead><tr><th>List</th><th>Dials</th><th>Connect rate</th><th>Booked</th><th>Status</th><th style="text-align:left">Why</th></tr></thead><tbody>'
        + rows + '<tr><td class="tierhead" colspan="6">Other</td></tr><tr><td>No list tag (booked, not tied to a list)</td><td class="dim">&mdash;</td><td class="dim">&mdash;</td><td>' + (otherBooked[r] || 0) + '</td><td></td><td></td></tr>'
        + '<tr class="total"><td>Total meetings booked</td><td></td><td></td><td>' + bookedTotal(r) + '</td><td></td><td></td></tr></tbody></table></div>'
        + '<p class="hint">Booked = meetings booked from HubSpot, credited to the list the lead was dialed from. It follows the weekly books sync.</p>' + (ed ? '<p class="hint">Reasons save when you leave the box and stay on the whole month (' + esc(P.key) + ').</p>' : '') + '</div>';
    }).join('<div style="height:20px"></div>');

    v.innerHTML = bar + tiles + (mode === 'rep' ? '' : grid + '<div style="height:20px"></div>') + (mode === 'rep' ? cards : '') + datalist;

    v.querySelectorAll('.seg button').forEach(function (b) { b.onclick = function () { lv.kind = b.dataset.kind; lv.offset = 0; render(); }; });
    var o = document.getElementById('ls-older'), n = document.getElementById('ls-newer');
    if (o) o.onclick = function () { lv.offset++; render(); };
    if (n) n.onclick = function () { lv.offset = Math.max(0, lv.offset - 1); render(); };
    v.querySelectorAll('input.note').forEach(function (inp) {
      inp.onchange = function () {
        var body = { rep: inp.dataset.rep, period_key: P.key, tier: inp.dataset.tier, list_name: inp.dataset.list, note: inp.value, by: me ? me.email : inp.dataset.rep };
        api('/api/list-note', body).then(function () {
          state.lists.notes = state.lists.notes.filter(function (x) {
            return !(x.rep === body.rep && x.period_key === body.period_key && x.tier === body.tier && x.list_name === body.list_name);
          });
          if (body.note.trim()) state.lists.notes.push({ rep: body.rep, period_key: body.period_key, tier: body.tier, list_name: body.list_name, note: body.note.trim() });
          inp.classList.remove('need');
          toast(body.note.trim() ? 'Reason saved' : 'Reason cleared');
        }).catch(function (e) { toast('Save failed: ' + e.message); });
      };
    });
  }

  function render() {
    renderTabs();
    var v = document.getElementById('view');
    if (active !== 'summary' && active !== 'history' && !state.settings.some(function (s) { return s.rep === active; })) active = 'summary';
    if (active === 'summary') { renderSummary(v); renderLists(v, 'team'); }
    else if (active === 'history') renderHistory(v);
    else { renderRep(v, active); renderLists(v, 'rep', active); }
  }

  load();
})();
</script>
</body>
</html>
