<!doctype html>
<html lang="en">
<head><script>window.JF_PAGE='leaderboard'</script><script src="config.js"></script><script src="sso.js?v=20261009c"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JumpFactor Sales Floor Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F6; --panel:#FFFFFF; --ink:#14213D; --muted:#5B6782; --line:#D9DFE9;
  --track:#E4E9F1; --fill:#2F5BEA; --fill-soft:#C9D6FB; --gold:#D99A1E; --pace:#14213D;
  --ahead:#1F8A5B; --behind:#C2410C; --chip:#E4E9F1;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1626; --panel:#172036; --ink:#E8ECF5; --muted:#97A3BD; --line:#26324D;
    --track:#222D45; --fill:#6E8EFF; --fill-soft:#2E3D66; --gold:#F0B43A; --pace:#E8ECF5;
    --ahead:#4CC38A; --behind:#F08A5D; --chip:#222D45;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1626; --panel:#172036; --ink:#E8ECF5; --muted:#97A3BD; --line:#26324D;
  --track:#222D45; --fill:#6E8EFF; --fill-soft:#2E3D66; --gold:#F0B43A; --pace:#E8ECF5;
  --ahead:#4CC38A; --behind:#F08A5D; --chip:#222D45;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 64px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:.95;margin:0;letter-spacing:-.01em}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-top:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ahead);box-shadow:0 0 0 0 var(--ahead);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ahead) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}.bar-fill{transition:none!important}}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:28px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,61,.12)}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.period{font-family:var(--display);font-weight:600;font-size:22px;min-width:200px;text-align:center}
.pace-note{color:var(--muted);font-size:14px;width:100%}

section{margin-bottom:40px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.lanes{background:var(--panel);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.lane{display:grid;grid-template-columns:56px minmax(120px,190px) 1fr 96px;align-items:center;gap:16px;padding:18px 20px;border-top:1px solid var(--line)}
.lane:first-child{border-top:0}
.rank{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--muted);text-align:center}
.lane.lead .rank{color:var(--gold)}
.who .name{font-weight:600;font-size:18px;line-height:1.2}
.who .sub{color:var(--muted);font-size:13px;margin-top:2px}
.score{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.score small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:4px}
.bar{position:relative;height:18px;background:var(--track);border-radius:4px}
.bar-fill{position:absolute;inset:0 auto 0 0;background:var(--fill);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.lane.lead .bar-fill{background:var(--gold)}
.bar-pace{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--pace);opacity:.75}
.bar-goal{position:absolute;right:0;top:-5px;bottom:-5px;width:2px;background:var(--muted)}
.bar-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;gap:8px}
.ahead{color:var(--ahead);font-weight:600}.behind{color:var(--behind);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:16px}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:9px 14px;text-align:right;border-top:1px solid var(--line);font-size:14px;white-space:nowrap}
thead th{border-top:0;font-weight:600;color:var(--muted)}
th:first-child,td:first-child{text-align:left}
td.goal{color:var(--muted)}
tr.group td{font-weight:600;color:var(--muted);background:var(--paper);font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:14px;font-weight:600}

.ae-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.ae-hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ae-hero .big{font-family:var(--display);font-weight:700;font-size:clamp(48px,8vw,72px);line-height:.9;font-variant-numeric:tabular-nums}
.ae-hero .lbl{color:var(--muted);font-size:14px;margin-top:6px}
.ae-hero .bar{width:min(380px,100%)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 28px}
.tile .t-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tile .t-name{font-size:14px;color:var(--muted);font-weight:500}
.tile .t-val{font-family:var(--display);font-weight:700;font-size:32px;font-variant-numeric:tabular-nums}
.tile .t-val span{font-size:18px;color:var(--muted);font-weight:600}
.tile .bar{height:10px;margin-top:4px}
.tile .bar-meta{margin-top:4px}
.ae-note{color:var(--muted);font-size:14px;margin-top:18px}

.empty{padding:28px;color:var(--muted);text-align:center}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:22px;color:var(--muted);font-size:14px}

dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(10,18,35,.45)}
.dlg-head{padding:18px 22px 10px}
.dlg-head h3{font-family:var(--display);font-size:26px;margin:0}
.dlg-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.dlg-body{padding:8px 22px 4px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;max-height:60vh;overflow:auto}
.dlg-body label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.dlg-body input,.dlg-body select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink)}
.dlg-body .full{grid-column:1 / -1}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 20px}
.err{color:var(--behind);font-size:14px;padding:0 22px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

@media (max-width:680px){
  .lane{grid-template-columns:40px 1fr auto;grid-template-areas:"r w s" "b b b";row-gap:10px;padding:16px}
  .lane .rank{grid-area:r;font-size:32px}.lane .who{grid-area:w}.lane .score{grid-area:s;font-size:36px}.lane .track{grid-area:b}
  .period{min-width:0;font-size:19px}
  .dlg-body{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Sales floor leaderboard</h1>
      <div class="live"><span class="dot" id="liveDot"></span><span id="liveText">Connecting to live numbers</span></div>
    </div>
    <button class="btn" id="logBtn" disabled>Log my numbers</button>
  </header>

  <div id="banner"></div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Period">
      <button data-p="week" aria-pressed="true">Week</button>
      <button data-p="month" aria-pressed="false">Month</button>
      <button data-p="quarter" aria-pressed="false">Quarter</button>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Previous period">‹</button>
      <div class="period" id="periodLabel"></div>
      <button id="next" aria-label="Next period">›</button>
      <button class="btn ghost" id="today" style="margin-left:6px">Current</button>
    </div>
    <div class="pace-note" id="paceNote"></div>
  </div>

  <section>
    <div class="sec-head">
      <h2>BDRs</h2>
      <div class="chips" id="bdrChips" role="group" aria-label="Rank BDRs by"></div>
    </div>
    <div class="lanes" id="lanes"></div>
    <details>
      <summary>Full BDR scorecard</summary>
      <div class="table-wrap" id="bdrTable"></div>
    </details>
  </section>

  <section>
    <div class="sec-head"><h2>AEs</h2></div>
    <div id="ae"></div>
  </section>
</div>

<dialog id="dlg">
  <form method="dialog" id="logForm" onsubmit="return false">
    <div class="dlg-head">
      <h3>Log end of day numbers</h3>
      <p>Enter the day's totals. Saving again for the same day replaces what was there.</p>
    </div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="err" id="dlgErr"></div>
    <div class="dlg-foot">
      <button class="btn ghost" type="button" id="cancelBtn">Cancel</button>
      <button class="btn" type="button" id="saveBtn">Save numbers</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- roster and goals (from the L10 daily scorecard) ---------- */
const ROSTER = [
  {key:"brandon-cameron", name:"Brandon Cameron", role:"bdr"},
  {key:"erich-roeder",    name:"Erich Roeder",    role:"bdr"},
  {key:"issa-hattar",     name:"Issa Hattar",     role:"bdr"},
  {key:"dipen-mistry",    name:"Dipen Mistry",    role:"ae"}
];
// weekly goals; month = 4x week, quarter = 3x month (matches the sheet's weekly/monthly columns)
const BDR_FIELDS = [
  {k:"pd",    label:"Power dials",        goal:1000},
  {k:"xd",    label:"Parallel dials",     goal:800},
  {k:"conn",  label:"Connects",           goal:null},
  {k:"comp",  label:"Completions",        goal:48},
  {k:"ob",    label:"Outbound discos booked", goal:null},
  {k:"ib",    label:"Inbound discos booked",  goal:null},
  {k:"shown", label:"Discos shown",       goal:8},
  {k:"ns",    label:"Disco no shows",     goal:null},
  {k:"des",   label:"Designs booked",     goal:4},
  {k:"act",   label:"Activated leads",    goal:9.6},
  {k:"cw",    label:"Closed won",         goal:1.2}
];
const BDR_RANK = [
  {id:"shown",  label:"Discos shown",  calc:t=>t.shown, goal:8},
  {id:"booked", label:"Discos booked", calc:t=>t.ob+t.ib, goal:12},
  {id:"des",    label:"Designs booked",calc:t=>t.des, goal:4},
  {id:"act",    label:"Activated leads",calc:t=>t.act, goal:9.6},
  {id:"comp",   label:"Completions",   calc:t=>t.comp, goal:48},
  {id:"conn",   label:"Connects",      calc:t=>t.conn, goal:null},
  {id:"dials",  label:"Dials",         calc:t=>t.pd+t.xd, goal:1800}
];
const AE_FIELDS = [
  {k:"calls", label:"Prospecting calls",   goal:131.6},
  {k:"run",   label:"Discos run",          goal:20},
  {k:"ns",    label:"Disco no shows",      goal:null},
  {k:"diag",  label:"Diagnosis created",   goal:null},
  {k:"opp",   label:"Opportunities (design)", goal:5},
  {k:"prop",  label:"Proposal reviews",    goal:8},
  {k:"con",   label:"Contracts sent",      goal:4},
  {k:"cw",    label:"Closed won (#)",      goal:2},
  {k:"cwd",   label:"Closed won ($)",      goal:10750, money:true}
];
const MULT = {week:1, month:4, quarter:12};

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function periodFor(kind, offset){
  const now = new Date(); now.setHours(0,0,0,0);
  let s, e, label;
  if(kind==="week"){
    s = new Date(now); const dow=(s.getDay()+6)%7; s.setDate(s.getDate()-dow+offset*7);
    e = new Date(s); e.setDate(e.getDate()+6);
    label = `${MON[s.getMonth()]} ${s.getDate()} to ${MON[e.getMonth()]} ${e.getDate()}, ${e.getFullYear()}`;
  } else if(kind==="month"){
    s = new Date(now.getFullYear(), now.getMonth()+offset, 1);
    e = new Date(s.getFullYear(), s.getMonth()+1, 0);
    label = `${MONTHS[s.getMonth()]} ${s.getFullYear()}`;
  } else {
    const q = Math.floor(now.getMonth()/3);
    s = new Date(now.getFullYear(), q*3 + offset*3, 1);
    e = new Date(s.getFullYear(), s.getMonth()+3, 0);
    label = `Q${Math.floor(s.getMonth()/3)+1} ${s.getFullYear()}`;
  }
  return {s, e, start:ymd(s), end:ymd(e), label, now};
}
function bizDays(a,b){ let n=0; const d=new Date(a); while(d<=b){ const w=d.getDay(); if(w!==0&&w!==6)n++; d.setDate(d.getDate()+1);} return n; }
function paceFraction(p){
  if(p.now > p.e) return 1;
  if(p.now < p.s) return 0;
  const total = bizDays(p.s,p.e); if(!total) return 1;
  return Math.min(1, bizDays(p.s,p.now)/total);
}

/* ---------- state ---------- */
const state = { kind:"week", offset:0, rank:"shown", me:null, docs:new Map(), own:new Map(), live:false, lastAt:null, canWrite:false };
let db = null;

/* ---------- aggregation ---------- */
function totals(repKey, fields, p){
  const t = Object.fromEntries(fields.map(f=>[f.k,0]));
  for(const doc of state.docs.values()){
    if(doc.rep!==repKey || !doc.days) continue;
    const m = doc.month; if(m < p.start.slice(0,7) || m > p.end.slice(0,7)) continue;
    for(const [day,vals] of Object.entries(doc.days)){
      if(day < p.start || day > p.end) continue;
      for(const f of fields){ const v = Number(vals[f.k]); if(isFinite(v)) t[f.k]+=v; }
    }
  }
  return t;
}
const fmt = (v,money) => money ? "$"+Math.round(v).toLocaleString() : (Math.round(v*10)/10).toLocaleString();
const pct = (a,b) => b>0 ? Math.round(a/b*100)+"%" : "–";

function barHTML(value, goal, pace, scaleMax){
  const max = goal || scaleMax || 1;
  const w = Math.min(100, value/max*100);
  let html = `<div class="bar"><div class="bar-fill" style="width:${w}%"></div>`;
  if(goal){ html += `<div class="bar-pace" style="left:calc(${pace*100}% - 1px)" title="Where you should be today"></div>`; }
  return html + `</div>`;
}
function paceText(value, goal, pace){
  if(!goal) return "";
  const target = goal*pace;
  if(pace===0) return `<span>Goal ${fmt(goal)}</span>`;
  const diff = value - target;
  if(value >= goal) return `<span class="ahead">Goal hit</span>`;
  return diff >= 0 ? `<span class="ahead">${fmt(diff)} ahead of pace</span>` : `<span class="behind">${fmt(-diff)} behind pace</span>`;
}

/* ---------- render ---------- */
function render(){
  const p = periodFor(state.kind, state.offset);
  const pace = paceFraction(p);
  const mult = MULT[state.kind];
  document.getElementById("periodLabel").textContent = p.label;
  document.getElementById("paceNote").textContent =
    pace===1 ? "Period complete. Bars show final results against goal."
    : pace===0 ? "This period hasn't started yet."
    : `${Math.round(pace*100)}% of selling days done. The dark tick on each bar marks where you need to be today.`;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.p===state.kind));

  // chips
  document.getElementById("bdrChips").innerHTML = BDR_RANK.map(r=>`<button data-r="${r.id}" aria-pressed="${r.id===state.rank}">${r.label}</button>`).join("");

  // BDR lanes
  const metric = BDR_RANK.find(r=>r.id===state.rank);
  const goal = metric.goal ? metric.goal*mult : null;
  const bdrs = ROSTER.filter(r=>r.role==="bdr").map(r=>{
    const t = totals(r.key, BDR_FIELDS, p);
    return {...r, t, v: metric.calc(t)};
  }).sort((a,b)=>b.v-a.v || a.name.localeCompare(b.name));
  const topV = Math.max(...bdrs.map(b=>b.v), 0);
  let rank=0, prev=null;
  const lanes = bdrs.map((b,i)=>{
    if(b.v!==prev){ rank=i+1; prev=b.v; }
    const lead = rank===1 && b.v>0;
    const t=b.t;
    return `<div class="lane${lead?" lead":""}">
      <div class="rank">${rank}</div>
      <div class="who"><div class="name">${b.name}</div><div class="sub">${lead?"Leading":""}</div></div>
      <div class="track">
        ${barHTML(b.v, goal, pace, topV)}
        <div class="bar-meta">${goal?`<span>${fmt(b.v)} of ${fmt(goal)} goal</span>`:`<span>No set goal, scaled to leader</span>`}${paceText(b.v, goal, pace)}</div>
        <div class="stats">
          <span>Shown <b>${fmt(t.shown)}</b></span>
          <span>Show rate <b>${pct(t.shown, t.shown+t.ns)}</b></span>
          <span>Booked <b>${fmt(t.ob+t.ib)}</b></span>
          <span>Designs <b>${fmt(t.des)}</b></span>
          <span>Activated <b>${fmt(t.act)}</b></span>
          <span>Completions <b>${fmt(t.comp)}</b></span>
        </div>
      </div>
      <div class="score">${fmt(b.v)}<small>${metric.label.toLowerCase()}</small></div>
    </div>`;
  }).join("");
  document.getElementById("lanes").innerHTML = state.docs.size || state.live ? lanes : `<div class="empty">Waiting for live numbers.</div>`;

  // BDR full table
  const team = Object.fromEntries(BDR_FIELDS.map(f=>[f.k, bdrs.reduce((s,b)=>s+b.t[f.k],0)]));
  const cols = [...bdrs.map(b=>({n:b.name.split(" ")[0], t:b.t})), {n:"Team", t:team}];
  const row = (label, fn, g) => `<tr><td>${label}</td>${cols.map(c=>`<td>${fn(c.t)}</td>`).join("")}<td class="goal">${g??""}</td></tr>`;
  const gm = g => g ? fmt(g*mult) : "";
  document.getElementById("bdrTable").innerHTML = `<table><thead><tr><th>Metric</th>${cols.map(c=>`<th>${c.n}</th>`).join("")}<th>Goal each</th></tr></thead><tbody>
    <tr class="group"><td colspan="${cols.length+2}">Activity</td></tr>
    ${row("Power dials", t=>fmt(t.pd), gm(1000))}
    ${row("Parallel dials", t=>fmt(t.xd), gm(800))}
    ${row("Connects", t=>fmt(t.conn))}
    ${row("Dial to connect", t=>pct(t.conn, t.pd+t.xd))}
    ${row("Completions", t=>fmt(t.comp), gm(48))}
    ${row("Connect to completion", t=>pct(t.comp, t.conn), "60%")}
    <tr class="group"><td colspan="${cols.length+2}">Meetings</td></tr>
    ${row("Outbound discos booked", t=>fmt(t.ob), gm(12))}
    ${row("Inbound discos booked", t=>fmt(t.ib))}
    ${row("Completion to disco", t=>pct(t.ob+t.ib, t.comp), "25%")}
    ${row("Discos shown", t=>fmt(t.shown), gm(8))}
    ${row("Disco no shows", t=>fmt(t.ns))}
    ${row("Show rate", t=>pct(t.shown, t.shown+t.ns), "75%")}
    ${row("Designs booked", t=>fmt(t.des), gm(4))}
    ${row("Activated leads", t=>fmt(t.act), gm(9.6))}
    ${row("Closed won", t=>fmt(t.cw), gm(1.2))}
  </tbody></table>`;

  // AE board
  const aes = ROSTER.filter(r=>r.role==="ae").map(r=>({...r, t:totals(r.key, AE_FIELDS, p)}))
    .sort((a,b)=>b.t.cwd-a.t.cwd || b.t.opp-a.t.opp);
  document.getElementById("ae").innerHTML = aes.map((a,i)=>{
    const t=a.t; const g=10750*mult;
    const tiles = AE_FIELDS.filter(f=>f.k!=="cwd").map(f=>{
      const fg = f.goal ? f.goal*mult : null;
      return `<div class="tile">
        <div class="t-top"><span class="t-name">${f.label}</span><span class="t-val">${fmt(t[f.k])}${fg?` <span>/ ${fmt(fg)}</span>`:""}</span></div>
        ${fg?barHTML(t[f.k], fg, pace):""}
        ${fg?`<div class="bar-meta">${paceText(t[f.k], fg, pace)}</div>`:""}
      </div>`;
    }).join("") + `<div class="tile">
        <div class="t-top"><span class="t-name">Disco show rate</span><span class="t-val">${pct(t.run, t.run+t.ns)}</span></div>
        <div class="bar-meta"><span>Target 75%</span></div>
      </div>
      <div class="tile">
        <div class="t-top"><span class="t-name">Disco to design</span><span class="t-val">${pct(t.opp, t.run)}</span></div>
        <div class="bar-meta"><span>Target 30%</span></div>
      </div>`;
    return `<div class="ae-card" style="margin-bottom:16px">
      <div class="ae-hero">
        <div>
          <div class="who"><div class="name">${aes.length>1?`#${i+1} `:""}${a.name}</div></div>
          <div class="big">${fmt(t.cwd,true)}</div>
          <div class="lbl">Closed won revenue against ${fmt(g,true)} goal</div>
        </div>
        <div class="track" style="width:min(380px,100%)">
          ${barHTML(t.cwd, g, pace)}
          <div class="bar-meta"><span>${pct(t.cwd,g)} of goal</span>${paceText(t.cwd, g, pace).replace(/([\d,.]+) (ahead|behind)/, (m,n,w)=>"$"+n+" "+w)}</div>
        </div>
      </div>
      <div class="tiles">${tiles}</div>
    </div>`;
  }).join("") + (aes.length===1 ? `<div class="ae-note">AEs rank by closed won revenue, then opportunities created, once a second AE is on the board.</div>` : "");

  updateLive();
}

function updateLive(){
  const dot=document.getElementById("liveDot"), txt=document.getElementById("liveText");
  if(state.live){
    dot.classList.add("on");
    const s = state.lastAt ? Math.round((Date.now()-state.lastAt)/1000) : 0;
    const ago = s<60 ? "just now" : s<3600 ? `${Math.floor(s/60)} min ago` : `${Math.floor(s/3600)} h ago`;
    txt.textContent = `Live. Last change received ${ago}.`;
  }
}
setInterval(updateLive, 30000);

/* ---------- controls ---------- */
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{state.kind=b.dataset.p; state.offset=0; render();}));
document.getElementById("prev").onclick=()=>{state.offset--; render();};
document.getElementById("next").onclick=()=>{state.offset++; render();};
document.getElementById("today").onclick=()=>{state.offset=0; render();};
document.getElementById("bdrChips").addEventListener("click",e=>{const b=e.target.closest("button"); if(b){state.rank=b.dataset.r; render();}});
try{ const r=localStorage.getItem("lb-rank2"); if(r && BDR_RANK.some(x=>x.id===r)) state.rank=r; }catch(e){}
document.getElementById("bdrChips").addEventListener("click",()=>{ try{localStorage.setItem("lb-rank2",state.rank);}catch(e){} });

/* ---------- log dialog ---------- */
const dlg=document.getElementById("dlg");
function fieldsFor(role){ return role==="ae" ? AE_FIELDS : BDR_FIELDS; }
function docIdFor(rep, date){ return `${rep}_${date.slice(0,7)}`; }
function fillDialog(){
  const repSel=document.getElementById("fRep"), dateIn=document.getElementById("fDate");
  const rep=ROSTER.find(r=>r.key===repSel.value);
  const existing = state.own.get(docIdFor(rep.key, dateIn.value))?.days?.[dateIn.value] || {};
  const box=document.getElementById("fFields");
  box.innerHTML = fieldsFor(rep.role).map(f=>`<label>${f.label}<input type="number" inputmode="decimal" min="0" step="any" data-k="${f.k}" value="${existing[f.k]??""}" placeholder="0"></label>`).join("");
}
function openDialog(){
  let last=""; try{ last=localStorage.getItem("lb-rep")||""; }catch(e){}
  document.getElementById("dlgBody").innerHTML = `
    <label>Who<select id="fRep">${ROSTER.filter(r=>state.me && (state.me.role==="admin" || state.me.lbkey===r.key)).map(r=>`<option value="${r.key}" ${r.key===last?"selected":""}>${r.name}</option>`).join("")}</select></label>
    <label>Day<input type="date" id="fDate" value="${ymd(new Date())}"></label>
    <div class="full" id="fFields" style="display:contents"></div>`;
  document.getElementById("fRep").onchange=fillDialog;
  document.getElementById("fDate").onchange=fillDialog;
  document.getElementById("dlgErr").textContent="";
  fillDialog();
  dlg.showModal();
}
document.getElementById("logBtn").onclick=openDialog;
document.getElementById("cancelBtn").onclick=()=>dlg.close();
document.getElementById("saveBtn").onclick=async()=>{
  const btn=document.getElementById("saveBtn"), err=document.getElementById("dlgErr");
  const repKey=document.getElementById("fRep").value, date=document.getElementById("fDate").value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ err.textContent="Pick a day before saving."; return; }
  const rep=ROSTER.find(r=>r.key===repKey);
  const vals={};
  for(const inp of document.querySelectorAll("#fFields input")){
    const v=parseFloat(inp.value); if(isFinite(v) && v>0) vals[inp.dataset.k]=v;
  }
  const id=docIdFor(repKey,date);
  const cur=state.own.get(id);
  const body = cur ? JSON.parse(JSON.stringify(cur)) : {rep:repKey, name:rep.name, role:rep.role, month:date.slice(0,7), days:{}};
  body.days = body.days || {};
  if(Object.keys(vals).length) body.days[date]=vals; else delete body.days[date];
  btn.disabled=true; err.textContent="";
  try{
    const resp = await fetch("/api/lb/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const out = await resp.json().catch(()=>({}));
    if(!resp.ok){ const e=new Error(out.error||"save failed"); e.code = resp.status===403 ? "invalid_argument" : "x"; throw e; }
    state.own.set(id, out.doc); await refresh();
    try{ localStorage.setItem("lb-rep",repKey); }catch(e){}
    dlg.close(); toast("Numbers saved");
  }catch(e){
    err.textContent = e && e.code==="invalid_argument"
      ? "Your access to this board is view only. Ask the owner to share it with you as a Contributor."
      : "Those numbers didn't save. Check your connection and save again.";
  }finally{ btn.disabled=false; }
};
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- live data (SSO backend, polled) ---------- */
async function refresh(){
  const r = await fetch("/api/lb/state",{cache:"no-store"});
  if(r.status===401){ location.reload(); return; }
  const d = await r.json();
  state.docs = new Map(Object.entries(d.docs));
  state.own = new Map(Object.entries(d.own));
  state.live = true; state.lastAt = Date.now();
  render();
}
render();
(async()=>{
  try{
    const me = await (await fetch("/auth/me")).json();
    state.me = me;
    state.canWrite = me.role==="admin" || !!me.lbkey;
    const logBtn=document.getElementById("logBtn");
    logBtn.disabled = !state.canWrite;
    if(!state.canWrite) logBtn.title="View only access";
    await refresh();
    setInterval(()=>refresh().catch(()=>{}), 60000);
  }catch(e){
    document.getElementById("liveText").textContent="Live connection dropped. Reload to reconnect.";
  }
})();
</script>
</body>
</html>
