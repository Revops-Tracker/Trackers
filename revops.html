<!doctype html>
<html lang="en">
<head><script>window.JF_PAGE='revops'</script><script src="config.js"></script><script src="sso.js?v=20261013a"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RevOps L10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F6; --panel:#FFFFFF; --ink:#14213D; --muted:#5B6782; --line:#D9DFE9;
  --track:#E4E9F1; --fill:#2F5BEA; --fill-soft:#C9D6FB; --gold:#D99A1E; --pace:#14213D;
  --ahead:#1F8A5B; --behind:#C2410C; --chip:#E4E9F1;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1626; --panel:#172036; --ink:#E8ECF5; --muted:#97A3BD; --line:#26324D;
    --track:#222D45; --fill:#6E8EFF; --fill-soft:#2E3D66; --gold:#F0B43A; --pace:#E8ECF5;
    --ahead:#4CC38A; --behind:#F08A5D; --chip:#222D45;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1626; --panel:#172036; --ink:#E8ECF5; --muted:#97A3BD; --line:#26324D;
  --track:#222D45; --fill:#6E8EFF; --fill-soft:#2E3D66; --gold:#F0B43A; --pace:#E8ECF5;
  --ahead:#4CC38A; --behind:#F08A5D; --chip:#222D45;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 64px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:.95;margin:0;letter-spacing:-.01em}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-top:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ahead);box-shadow:0 0 0 0 var(--ahead);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ahead) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}.bar-fill{transition:none!important}}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:28px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,61,.12)}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.period{font-family:var(--display);font-weight:600;font-size:22px;min-width:200px;text-align:center}
.pace-note{color:var(--muted);font-size:14px;width:100%}

section{margin-bottom:40px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.lanes{background:var(--panel);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.lane{display:grid;grid-template-columns:56px minmax(120px,190px) 1fr 96px;align-items:center;gap:16px;padding:18px 20px;border-top:1px solid var(--line)}
.lane:first-child{border-top:0}
.rank{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--muted);text-align:center}
.lane.lead .rank{color:var(--gold)}
.who .name{font-weight:600;font-size:18px;line-height:1.2}
.who .sub{color:var(--muted);font-size:13px;margin-top:2px}
.score{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.score small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:4px}
.bar{position:relative;height:18px;background:var(--track);border-radius:4px}
.bar-fill{position:absolute;inset:0 auto 0 0;background:var(--fill);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.lane.lead .bar-fill{background:var(--gold)}
.bar-pace{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--pace);opacity:.75}
.bar-goal{position:absolute;right:0;top:-5px;bottom:-5px;width:2px;background:var(--muted)}
.bar-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;gap:8px}
.ahead{color:var(--ahead);font-weight:600}.behind{color:var(--behind);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:16px}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:9px 14px;text-align:right;border-top:1px solid var(--line);font-size:14px;white-space:nowrap}
thead th{border-top:0;font-weight:600;color:var(--muted)}
th:first-child,td:first-child{text-align:left}
td.goal{color:var(--muted)}
tr.group td{font-weight:600;color:var(--muted);background:var(--paper);font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:14px;font-weight:600}

.ae-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.ae-hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ae-hero .big{font-family:var(--display);font-weight:700;font-size:clamp(48px,8vw,72px);line-height:.9;font-variant-numeric:tabular-nums}
.ae-hero .lbl{color:var(--muted);font-size:14px;margin-top:6px}
.ae-hero .bar{width:min(380px,100%)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 28px}
.tile .t-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tile .t-name{font-size:14px;color:var(--muted);font-weight:500}
.tile .t-val{font-family:var(--display);font-weight:700;font-size:32px;font-variant-numeric:tabular-nums}
.tile .t-val span{font-size:18px;color:var(--muted);font-weight:600}
.tile .bar{height:10px;margin-top:4px}
.tile .bar-meta{margin-top:4px}
.ae-note{color:var(--muted);font-size:14px;margin-top:18px}

.empty{padding:28px;color:var(--muted);text-align:center}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:22px;color:var(--muted);font-size:14px}

dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(10,18,35,.45)}
.dlg-head{padding:18px 22px 10px}
.dlg-head h3{font-family:var(--display);font-size:26px;margin:0}
.dlg-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.dlg-body{padding:8px 22px 4px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;max-height:60vh;overflow:auto}
.dlg-body label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.dlg-body input,.dlg-body select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink)}
.dlg-body .full{grid-column:1 / -1}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 20px}
.err{color:var(--behind);font-size:14px;padding:0 22px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

@media (max-width:680px){
  .lane{grid-template-columns:40px 1fr auto;grid-template-areas:"r w s" "b b b";row-gap:10px;padding:16px}
  .lane .rank{grid-area:r;font-size:32px}.lane .who{grid-area:w}.lane .score{grid-area:s;font-size:36px}.lane .track{grid-area:b}
  .period{min-width:0;font-size:19px}
  .dlg-body{grid-template-columns:1fr}
}
</style>
</head>
<body>
<style>
.auto-tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--chip);color:var(--muted);border-radius:999px;padding:3px 10px;margin-left:10px;vertical-align:middle}
.click{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.click:hover{color:var(--fill)}
button.linkish{border:0;background:transparent;padding:0;color:var(--fill);font-weight:600;cursor:pointer}
.lane .who .sub .linkish{font-size:13px}
.deal-list{list-style:none;margin:0;padding:0 22px;max-height:62vh;overflow:auto}
.deal{border-top:1px solid var(--line);padding:12px 0}
.deal:first-child{border-top:0}
.deal .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.deal .nm{font-weight:600}
.deal .nm a{color:var(--ink)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--ahead) 18%,transparent);color:var(--ahead)}
.pill.bad{background:color-mix(in srgb,var(--behind) 18%,transparent);color:var(--behind)}
.deal .why{color:var(--muted);font-size:13px;margin-top:4px}
.deal .fix{margin-top:6px;font-size:13px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.deal .corr{background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.grp{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);padding:14px 22px 2px;margin:0}
.fixbox{display:grid;gap:10px;padding:10px 0 4px}
.fixbox label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.fixbox select,.fixbox textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink)}
.fixbox textarea{min-height:56px;resize:vertical}
.fixbox .row{display:flex;gap:8px;justify-content:flex-end}
.legend{color:var(--muted);font-size:13px;margin-top:10px}
#reviewBar{display:flex;flex-wrap:wrap;gap:10px;margin:-8px 0 22px}
.rv{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:15px}
.rv.todo{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel))}
.rv .prog{color:var(--muted);font-size:13px}
.tf{display:inline-flex;gap:6px}
.tf button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 12px;font-weight:600;cursor:pointer}
.tf button.t{color:var(--ahead);border-color:color-mix(in srgb,var(--ahead) 45%,var(--line))}
.tf button.f{color:var(--behind);border-color:color-mix(in srgb,var(--behind) 45%,var(--line))}
.ok{color:var(--ahead);font-weight:600}
.dlg-head{position:relative;padding-right:56px}
.dlg-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dlg-x:hover{background:var(--line)}
/* Reporting page (admins): same data and code, leaderboard sections hidden */
html.view-reporting .lb-only{display:none!important}
.tbl-toggle{display:flex;justify-content:flex-end;margin:14px 0 0}
#bdrMetrics,#aeMetrics{margin-top:12px}
#aeMetrics[hidden],#trPickWrap[hidden]{display:none}
#bdrMetrics[hidden]{display:none}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.nav button.btn{width:auto;padding:0 14px;font-size:15px;white-space:nowrap}
.deal .pend{background:color-mix(in srgb,var(--fill) 12%,transparent);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.tr-root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tr-root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9}}
:root[data-theme="dark"] .tr-root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9}
.tr-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 12px}
.tr-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 8px}
.tr-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}
.tr-legend span{display:inline-flex;align-items:center;gap:6px}
.tr-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tr-plot svg{display:block;width:100%;height:auto;overflow:visible}
.tr-plot text{font-family:var(--body);fill:var(--muted);font-size:12px}
.tr-plot .tot{fill:var(--ink);font-weight:600}
.tr-plot .grid{stroke:var(--line);stroke-width:1}
.tr-plot .seg-r{cursor:pointer}
.tr-plot .col:hover .hit{fill:var(--chip)}
.tr-tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(10,20,40,.18);padding:8px 10px;font-size:13px;min-width:150px;display:none;z-index:2}
.tr-tip .h{font-weight:600;margin-bottom:4px}
.tr-tip .r{display:flex;justify-content:space-between;gap:14px}
.tr-tip .r span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.tr-tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tr-tip .t{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:600}
#trTableWrap{margin-top:12px}
.tr-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tr-range{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:500}
.tr-range select,.tr-custom input{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
.tr-custom{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.tr-custom[hidden]{display:none}
.tr-sub{font-size:13px;color:var(--muted);margin-bottom:8px}
/* Connect rate dashboard + Nooks CSV drop zone */
.cr-drop{border:2px dashed var(--line);border-radius:12px;background:var(--panel);padding:14px 10px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.cr-drop:hover,.cr-drop.over,.cr-drop:focus-visible{border-color:var(--fill);background:color-mix(in srgb,var(--fill) 7%,var(--panel))}
.cr-drop b{color:var(--ink);font-size:16px}
.cr-up{color:var(--fill);margin-bottom:2px}
.cr-drop .hint{font-size:13px;margin-top:4px}
.cr-weekpick{display:flex;flex-direction:column;gap:6px;margin:10px 0 0;color:var(--muted);font-size:13px}
.cr-layout{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;align-items:start}
.cr-main{min-width:0}
.cr-side{position:sticky;top:70px}
@media (max-width:900px){.cr-layout{grid-template-columns:1fr}.cr-side{position:static;order:-1;display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}.cr-weekpick{margin:0}}
.cr-weekpick input{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
.cr-weekpick .wk{color:var(--ink);font-weight:600}
.cr-prev{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:16px 18px;margin:14px 0}
.cr-prev h3{font-family:var(--display);font-size:24px;margin:0 0 4px}
.cr-prev .sub{color:var(--muted);font-size:14px;margin-bottom:10px}
.cr-prev .table-wrap{margin-top:8px}
.cr-prev .row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.cr-warn{background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:8px;padding:8px 12px;font-size:14px;margin:10px 0}
.cr-bad{background:color-mix(in srgb,var(--behind) 14%,transparent);border-radius:8px;padding:8px 12px;font-size:14px;margin:10px 0;color:var(--behind)}
.cr-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:18px 0 6px}
.cr-tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cr-tile .k{font-size:13px;color:var(--muted)}
.cr-tile .v{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.cr-tile .s{font-size:12px;color:var(--muted)}
.cr-tbl{min-width:640px}
.cr-tbl tr.team td{font-weight:700;border-top:2px solid var(--line)}
.cr-tbl tr.bdr td{font-weight:600;background:var(--paper)}
.cr-tbl tr.tier td:first-child{padding-left:30px}
.cr-tbl tr.list td{color:var(--muted)}
.cr-tbl tr.list td:first-child{padding-left:52px}
.cr-tbl tr.pick{cursor:pointer}
.cr-tbl tr.pick:hover td{background:var(--chip)}
.cr-tgl{border:0;background:transparent;cursor:pointer;color:inherit;font:inherit;font-weight:inherit;text-align:left;padding:0;display:inline-flex;gap:8px;align-items:center}
.cr-tgl i{font-style:normal;display:inline-block;width:12px;color:var(--muted);transition:transform .15s}
.cr-tgl[aria-expanded="true"] i{transform:rotate(90deg)}
.cr-none{color:var(--muted);font-weight:400}
.cr-root details{margin-top:14px}
.rp-tabs{margin:0 0 26px}
.rp-tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,61,.12)}
.rp-tabs button{border:0;background:transparent;padding:8px 18px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
section[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="pageTitle">RevOps L10 <span class="auto-tag">Admins</span></h1>
    </div>
  </header>

  <section class="cr-root" id="crSec">
    <div class="sec-head">
      <h2 id="crTitle">Connect rate</h2>
      <div class="nav">
        <button type="button" id="crPrev" aria-label="Previous week">‹</button>
        <div class="period" id="crWeekLabel" aria-live="polite"></div>
        <button type="button" id="crNext" aria-label="Next week">›</button>
        <button class="btn ghost" type="button" id="crLatest" style="margin-left:6px">Latest</button>
      </div>
    </div>

    <div id="crPreview"></div>

    <div class="cr-layout">
      <div class="cr-main">
        <div class="cr-tiles" id="crTiles"></div>
        <div class="table-wrap"><table class="cr-tbl" id="crTable"></table></div>
        <div class="legend" id="crLegend"></div>

<script>
/* ---------- Connect rate dashboard + Nooks CSV drop (admins) ---------- */
(function(){
"use strict";
const API = ((window.JF_CONFIG||{}).API_BASE||"").replace(/\/jf-sso$/, "/bdr-report");
const $ = id => document.getElementById(id);
const h = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ORDER = ["Brandon","Issa","Erich","Jules"];
const TIERS = ["Tier 1","Tier 2","Tier 3","None"];
const S = { data:null, week:null, open:{}, parsed:null, file:"", saving:false };

const token = () => { try{ return localStorage.getItem("jf_token"); }catch(e){ return null; } };
async function call(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: "Bearer " + token() }, opts.headers || {});
  const r = await fetch(API + path, opts);
  const j = await r.json().catch(()=>({}));
  if(!r.ok || j.ok === false) throw new Error(j.error || ("Request failed (" + r.status + ")"));
  return j;
}
const say = m => { if(typeof toast === "function") toast(m); };

/* dates are plain YYYY-MM-DD strings handled in UTC so time zones never shift a week */
const d2s = d => d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
const s2d = s => { const p = s.split("-"); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2])); };
const add = (s,n) => { const d = s2d(s); d.setUTCDate(d.getUTCDate()+n); return d2s(d); };
const lbl = s => { const d = s2d(s); return MON[d.getUTCMonth()] + " " + d.getUTCDate(); };
const weekLabel = end => "Mon " + lbl(add(end,-5)) + " – Sat " + lbl(end);
const sundayOnOrBefore = s => add(s, -s2d(s).getUTCDay());
const todayStr = () => { const n = new Date(); return d2s(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()))); };
const num = x => Number(x||0).toLocaleString("en-US");
const pct = (a,b) => b ? (100*a/b).toFixed(1)+"%" : "–";
const target = () => parseFloat((S.data && S.data.config && S.data.config.connect_rate_target) || "0.03");
const rateCell = (c,d) => d ? '<span class="'+((c/d)>=target()?"ahead":"behind")+'">'+pct(c,d)+'</span>' : "–";

/* ---------- week data ---------- */
function weekList(){
  const set = new Set(); (S.data.connectRate||[]).forEach(r=>set.add(r.week_ending));
  return Array.from(set).sort().reverse();
}
function buildWeek(w){
  const D = S.data, by = {};
  const mk = bdr => by[bdr] || (by[bdr] = { bdr, tiers:{}, d:0, c:0, v:0, books:0, inb:0, leads:0 });
  const tier = (b,t) => b.tiers[t] || (b.tiers[t] = { tier:t, d:0, c:0, v:0, books:0, lists:{} });
  (D.connectRate||[]).filter(r=>r.week_ending===w).forEach(r=>{
    const b = mk(r.bdr), t = tier(b, r.tier);
    t.d += r.dials; t.c += r.connects; t.v += r.meaningful_dispositions;
    b.d += r.dials; b.c += r.connects; b.v += r.meaningful_dispositions;
  });
  (D.byList||[]).filter(r=>r.week_ending===w).forEach(r=>{
    const t = tier(mk(r.bdr), r.tier);
    const l = t.lists[r.list_name] || (t.lists[r.list_name] = { name:r.list_name, d:0, c:0, v:0, books:0 });
    l.d += r.dials; l.c += r.connects; l.v += r.meaningful_dispositions;
  });
  (D.discos||[]).filter(r=>r.week_ending===w).forEach(r=>{ if(r.discos_booked || by[r.bdr]) mk(r.bdr).books = r.discos_booked; });
  (D.books||[]).filter(r=>r.week_ending===w).forEach(r=>{
    const t = tier(mk(r.bdr), r.tier);
    t.books += r.outbound_books;
    const l = t.lists[r.list_name] || (t.lists[r.list_name] = { name:r.list_name, d:0, c:0, v:0, books:0 });
    l.books += r.outbound_books;
  });
  (D.inbound||[]).filter(r=>r.week_ending===w).forEach(r=>{ if(r.inbound_books || by[r.bdr]) mk(r.bdr).inb = r.inbound_books; });
  (D.segments||[]).filter(r=>r.week_ending===w).forEach(r=>{ if(SKIP_BDRS.indexOf(r.bdr) < 0 && (r.parallel_leads + r.power_leads + (r.other_leads||0) || by[r.bdr])) mk(r.bdr).leads = r.parallel_leads + r.power_leads + (r.other_leads||0); });
  const list = Object.values(by).sort((a,b)=>{
    const ia = ORDER.indexOf(a.bdr), ib = ORDER.indexOf(b.bdr);
    return (ia<0?99:ia) - (ib<0?99:ib) || a.bdr.localeCompare(b.bdr);
  });
  const team = list.reduce((a,b)=>({ d:a.d+b.d, c:a.c+b.c, v:a.v+b.v, books:a.books+b.books, inb:a.inb+b.inb, leads:a.leads+b.leads }), { d:0, c:0, v:0, books:0, inb:0, leads:0 });
  team.leadN = list.filter(b=>b.leads > 0).length;   // BDRs that were given leads this week
  return { bdrs:list, team };
}

/* ---------- dashboard ---------- */
function render(){
  const D = S.data;
  if(!D){ return; }
  const weeks = weekList();
  if(!S.week || weeks.indexOf(S.week) < 0) S.week = weeks[0] || null;
  const i = weeks.indexOf(S.week);
  $("crPrev").disabled = i < 0 || i >= weeks.length-1;
  $("crNext").disabled = i <= 0;
  $("crLatest").disabled = i <= 0;
  if(!S.week){
    $("crWeekLabel").textContent = "No data yet";
    $("crTiles").innerHTML = ""; $("crTable").innerHTML = '<tbody><tr><td class="empty">Drop a Nooks CSV above to add the first week.</td></tr></tbody>';
    return;
  }
  $("crWeekLabel").textContent = weekLabel(S.week);
  const W = buildWeek(S.week);
  const T = W.team;
  $("crTiles").innerHTML =
    tile("Team connect rate", T.d ? '<span class="'+((T.c/T.d)>=target()?"ahead":"behind")+'">'+pct(T.c,T.d)+'</span>' : "–", "target "+(target()*100).toFixed(1)+"%") +
    tile("Dials", num(T.d), "") + tile("Connects", num(T.c), "") + tile("Conversations", num(T.v), "") +
    tile("Outbound books", num(T.books), "") + tile("Inbound books", num(T.inb), "") + tile("7 Day TVL", T.leadN ? num(Math.round(T.leads/T.leadN)) : "–", T.leadN ? "avg leads per BDR (parallel + power), across "+T.leadN+" BDRs" : "");

  let rows = '<thead><tr><th></th><th>Dials</th><th>Connects</th><th>Connect rate</th><th>Conversations</th><th>Outbound books</th></tr></thead><tbody>';
  rows += '<tr class="team"><td>Team</td><td>'+num(T.d)+'</td><td>'+num(T.c)+'</td><td>'+rateCell(T.c,T.d)+'</td><td>'+num(T.v)+'</td><td>'+num(T.books)+'</td></tr>';
  W.bdrs.forEach(b=>{
    const kb = "b:"+b.bdr, ob = !!S.open[kb];
    rows += '<tr class="bdr"><td><button type="button" class="cr-tgl" data-k="'+h(kb)+'" aria-expanded="'+ob+'"><i>▸</i>'+h(b.bdr)+'</button></td><td>'+num(b.d)+'</td><td>'+num(b.c)+'</td><td>'+rateCell(b.c,b.d)+'</td><td>'+num(b.v)+'</td><td>'+num(b.books)+'</td></tr>';
    if(!ob) return;
    TIERS.forEach(tn=>{
      const t = b.tiers[tn]; if(!t) return;
      const kt = "t:"+b.bdr+":"+tn, ot = !!S.open[kt];
      const name = tn === "None" ? '<span class="cr-none">Books not tied to a tier list</span>' : h(tn);
      rows += '<tr class="tier"><td><button type="button" class="cr-tgl" data-k="'+h(kt)+'" aria-expanded="'+ot+'"><i>▸</i>'+name+'</button></td><td>'+(tn==="None"?"":num(t.d))+'</td><td>'+(tn==="None"?"":num(t.c))+'</td><td>'+(tn==="None"?"":rateCell(t.c,t.d))+'</td><td>'+(tn==="None"?"":num(t.v))+'</td><td>'+num(t.books)+'</td></tr>';
      if(!ot) return;
      Object.values(t.lists).sort((x,y)=>y.d-x.d || y.books-x.books || x.name.localeCompare(y.name)).forEach(l=>{
        rows += '<tr class="list"><td>'+h(l.name)+'</td><td>'+num(l.d)+'</td><td>'+num(l.c)+'</td><td>'+rateCell(l.c,l.d)+'</td><td>'+num(l.v)+'</td><td>'+num(l.books)+'</td></tr>';
      });
    });
  });
  rows += '</tbody>';
  $("crTable").innerHTML = rows;

  $("crLegend").innerHTML = '<b>Connect rate</b> = connects ÷ dials, green at or above the '+(target()*100).toFixed(1)+'% target. Click a BDR to see tiers, then a tier to see its lists. <b>Conversations</b> are the Nooks "meaningful" dispositions. Weeks run Monday to Saturday. Outbound books count a Discovery Booked call, or a Meeting Rebook 30+ days after the last Discovery Booked, in the week of the call.';
  try{ renderQ3(); }catch(e){ console.error('Q3 section', e); }
  const up = (D.uploads||[])[0];
  const synced = D.booksSyncedAt ? new Date(D.booksSyncedAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : null;
  $("crFoot").innerHTML = (up ? 'Last Nooks upload: week ending '+h(up.week_ending)+', by '+h(up.uploaded_by)+' on '+h(new Date(up.uploaded_at).toLocaleDateString("en-US",{month:"short",day:"numeric"}))+'. ' : '') +
    'Books, inbound books and leads delivered come from the Weekly BDR Report sheet'+(synced ? ' (last synced '+h(synced)+')' : '')+'.';
}
const tile = (k,v,s) => '<div class="cr-tile"><div class="k">'+h(k)+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+h(s)+'</div>':'')+'</div>';

/* ---------- Q3: 7 Day TVL leads per BDR (HubSpot segments: parallel + power) ---------- */
const SKIP_BDRS = [];                           // nobody left out; Jules has rows only for the weeks she was a BDR
const OFF_WEEKS = {"Issa|2026-08-15": 1};          // BDR was off the round robin that week: shown as Off, left out of the average
const Q3_FIRST = "2026-07-11", Q3_LAST = "2026-10-03";   // week-ending Saturdays of the 13 Mon-Sun weeks that start in Q3
function renderQ3(){
  const D = S.data, seg = D.segments || [];
  const weeks = Array.from(new Set(seg.map(r=>r.week_ending))).filter(w=>w>=Q3_FIRST && w<=Q3_LAST).sort();
  const names = ORDER.filter(n => SKIP_BDRS.indexOf(n) < 0 && seg.some(r=>r.bdr===n));
  const get = (n,w) => OFF_WEEKS[n+"|"+w] ? null : (seg.filter(r=>r.bdr===n && r.week_ending===w)[0] || null);
  const sm = 'font-size:12px;font-weight:400;color:var(--muted)';
  let t = '<table class="cr-tbl"><thead><tr><th>Week</th>'+names.map(n=>'<th>'+h(n)+''+'</th>').join("")+'</tr></thead><tbody>';
  weeks.forEach(w=>{
    t += '<tr><td>'+h(weekLabel(w))+(w<="2026-08-01" ? '<div style="'+sm+'">leads split across 5 BDRs</div>' : '')+'</td>'+names.map(n=>{
      const r = get(n,w);
      const o = r ? (r.other_leads||0) : 0;
      return '<td>'+(r ? num(r.parallel_leads+r.power_leads+o)+'<div style="'+sm+'">'+(o ? num(o)+' Closed Lost (manual list)' : num(r.parallel_leads)+' parallel + '+num(r.power_leads)+' power')+'</div>' : (OFF_WEEKS[n+"|"+w] ? 'Off<div style="'+sm+'">removed from round robin</div>' : "–"))+'</td>';
    }).join("")+'</tr>';
  });
  t += '<tr class="team"><td>Average per week<div style="'+sm+'">over the weeks each BDR was on the list</div></td>'+names.map(n=>{
    const rs = weeks.map(w=>get(n,w)).filter(Boolean);
    if(!rs.length) return '<td>–</td>';
    const ap = rs.reduce((a,r)=>a+r.parallel_leads,0)/rs.length, aw = rs.reduce((a,r)=>a+r.power_leads,0)/rs.length, ao = rs.reduce((a,r)=>a+(r.other_leads||0),0)/rs.length;
    return '<td>'+num(Math.round(ap+aw+ao))+'<div style="'+sm+'">'+num(Math.round(ap))+' parallel + '+num(Math.round(aw))+' power'+(ao ? ' + '+num(Math.round(ao))+' Closed Lost' : '')+' · '+rs.length+' wks</div></td>';
  }).join("")+'</tr></tbody></table>';
  $("q3Leads").innerHTML = t;
}


/* ---------- Nooks CSV: parse, map to tiers, preview, save ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], f = "", q = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; row.push(f); f = ""; if(row.length > 1 || row[0] !== "") rows.push(row); row = []; }
    else f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function canonList(raw){
  let s = String(raw).replace(/\s+/g, " ").trim();
  if(/do not use|direct dial|\(cloned\)/i.test(s)) return null;      // never counted
  s = s.replace(/\s*-\s*temporary$/i, "").replace(/^7\s*day\b/i, "7 Day");
  const low = s.toLowerCase();
  return (S.data.tierLists||[]).find(t=>t.list_name.toLowerCase() === low) || null;
}
function mapCsv(rows){
  const head = rows[0].map(x=>String(x).trim().toLowerCase());
  const ix = n => head.indexOf(n);
  const iN = ix("sequence name"), iD = ix("dials"), iC = ix("connects"), iV = ix("conversations");
  if(iN < 0 || iD < 0 || iC < 0 || iV < 0) throw new Error("This does not look like the Nooks Sequence performance export (it needs Sequence Name, Dials, Connects and Conversations columns).");
  const roster = {}; (S.data.bdrs||[]).forEach(b=>{ roster[b.bdr.toLowerCase()] = b.bdr; });
  const agg = {}, skipped = [];
  let srcDials = 0, usedDials = 0, lines = 0;
  rows.slice(1).forEach(r=>{
    const name = String(r[iN]||"").trim(); if(!name) return;
    const dials = parseInt(r[iD],10)||0, conn = parseInt(r[iC],10)||0, conv = parseInt(r[iV],10)||0;
    lines++; srcDials += dials;
    const first = name.split(/\s+/)[0], rest = name.slice(first.length).trim();
    const bdr = roster[first.toLowerCase()];
    if(!bdr){ skipped.push({ name, dials, why:"not on the BDR roster" }); return; }
    const hit = canonList(rest);
    if(!hit){ skipped.push({ name, dials, why:"list is not in the tier scheme" }); return; }
    const k = bdr+"|"+hit.tier+"|"+hit.list_name;
    const a = agg[k] || (agg[k] = { bdr, tier:hit.tier, list:hit.list_name, dials:0, connects:0, conversations:0, from:[] });
    a.dials += dials; a.connects += conn; a.conversations += conv; a.from.push(name);
    usedDials += dials;
  });
  const out = Object.values(agg);
  if(!out.length) throw new Error("No rows matched a BDR and a tier list, so nothing would be saved. Check that this is the right file.");
  return { rows:out, skipped, srcDials, usedDials, lines };
}
function sundayValue(){
  const v = $("crSunday").value; if(!v) return null;
  return sundayOnOrBefore(v);
}
function updateWeekLbl(){
  const sun = sundayValue();
  const raw = $("crSunday").value;
  $("crWeekLbl").textContent = sun ? ("Sun " + lbl(sun) + " to Sat " + lbl(add(sun,6)) + (raw && raw !== sun ? "  (moved back to that Sunday)" : "")) : "";
}
function renderPreview(){
  const box = $("crPreview");
  if(!S.parsed){ box.innerHTML = ""; return; }
  const sun = sundayValue();
  if(!sun){ box.innerHTML = '<div class="cr-warn">Pick the week this file is for.</div>'; return; }
  const end = add(sun, 6), P = S.parsed;
  const cur = (S.data.connectRate||[]).filter(r=>r.week_ending===end);
  const curBy = {}; cur.forEach(r=>{ const b = curBy[r.bdr] || (curBy[r.bdr] = { d:0, c:0 }); b.d += r.dials; b.c += r.connects; });
  const newBy = {}; P.rows.forEach(r=>{ const b = newBy[r.bdr] || (newBy[r.bdr] = { d:0, c:0, v:0 }); b.d += r.dials; b.c += r.connects; b.v += r.conversations; });
  const names = Array.from(new Set(Object.keys(newBy).concat(Object.keys(curBy)))).sort((a,b)=>{ const ia=ORDER.indexOf(a), ib=ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
  const nd = P.rows.reduce((a,r)=>a+r.dials,0), nc = P.rows.reduce((a,r)=>a+r.connects,0);
  const cd = cur.reduce((a,r)=>a+r.dials,0), cc = cur.reduce((a,r)=>a+r.connects,0);
  let tb = '<table><thead><tr><th>BDR</th><th>New dials</th><th>New connects</th><th>New rate</th><th>Saved dials</th><th>Saved rate</th></tr></thead><tbody>';
  names.forEach(n=>{
    const a = newBy[n], c = curBy[n];
    tb += '<tr><td>'+h(n)+'</td><td>'+(a?num(a.d):"–")+'</td><td>'+(a?num(a.c):"–")+'</td><td>'+(a?rateCell(a.c,a.d):"–")+'</td><td>'+(c?num(c.d):"–")+'</td><td>'+(c?rateCell(c.c,c.d):"–")+'</td></tr>';
  });
  tb += '<tr class="team"><td>Team</td><td>'+num(nd)+'</td><td>'+num(nc)+'</td><td>'+rateCell(nc,nd)+'</td><td>'+(cd?num(cd):"–")+'</td><td>'+(cd?rateCell(cc,cd):"–")+'</td></tr></tbody></table>';
  let warn = "";
  if(cd && nd < cd) warn += '<div class="cr-warn"><b>Heads up:</b> this file has fewer dials ('+num(nd)+') than what is already saved for this week ('+num(cd)+'). It may be an older export or the wrong week. Check the dates before you save.</div>';
  else if(cd) warn += '<div class="cr-warn">This week already has data. Saving replaces it with this file.</div>';
  const skipDials = P.skipped.reduce((a,r)=>a+r.dials,0);
  const skip = P.skipped.length ? '<details><summary>'+P.skipped.length+' rows left out ('+num(skipDials)+' dials): not on the roster or not in the tier scheme</summary><div class="table-wrap"><table><thead><tr><th>Sequence</th><th>Dials</th><th>Why</th></tr></thead><tbody>'+
    P.skipped.slice().sort((a,b)=>b.dials-a.dials).map(r=>'<tr><td>'+h(r.name)+'</td><td>'+num(r.dials)+'</td><td>'+h(r.why)+'</td></tr>').join("")+'</tbody></table></div></details>' : "";
  box.innerHTML = '<div class="cr-prev"><h3>Ready to save week ending Sat '+h(lbl(end))+'</h3>'+
    '<div class="sub">'+h(S.file)+' · '+P.rows.length+' lists across '+Object.keys(newBy).length+' BDRs · '+num(P.usedDials)+' of '+num(P.srcDials)+' dials counted</div>'+
    warn + '<div class="table-wrap">'+tb+'</div>'+skip+
    '<div class="row"><button class="btn ghost" type="button" id="crCancel">Cancel</button><button class="btn" type="button" id="crSave"'+(S.saving?" disabled":"")+'>'+(cd ? "Replace this week" : "Save this week")+'</button></div></div>';
  $("crCancel").onclick = () => { S.parsed = null; S.file = ""; $("crFile").value = ""; renderPreview(); };
  $("crSave").onclick = save;
}
async function save(){
  const sun = sundayValue(); if(!sun || !S.parsed || S.saving) return;
  const end = add(sun, 6);
  S.saving = true; renderPreview();
  try{
    const P = S.parsed;
    const r = await call("/nooks", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({
      weekEnding: end, filename: S.file, sourceRows: P.lines,
      rows: P.rows.map(x=>({ bdr:x.bdr, tier:x.tier, list:x.list, dials:x.dials, connects:x.connects, conversations:x.conversations })),
      excluded: P.skipped.map(x=>({ name:x.name, dials:x.dials, why:x.why }))
    }) });
    S.parsed = null; S.file = ""; $("crFile").value = "";
    await load(); S.week = end; render(); renderPreview();
    say("Connect rate updated for week ending "+lbl(end)+" ("+num(r.dials)+" dials)");
    $("crSec").scrollIntoView({ behavior:"smooth", block:"start" });
  }catch(e){
    $("crPreview").insertAdjacentHTML("afterbegin", '<div class="cr-bad">Could not save: '+h(e.message)+'</div>');
  }finally{ S.saving = false; if(S.parsed) renderPreview(); }
}
function onFile(f){
  if(!f) return;
  if(!/\.csv$/i.test(f.name) && !/csv/i.test(f.type)){ say("Choose the CSV file from Nooks"); return; }
  if(f.size > 2_000_000){ say("That file is too big to be the Nooks export"); return; }
  if(!S.data){ say("Still loading, try again in a second"); return; }
  const rd = new FileReader();
  rd.onload = () => {
    try{ S.parsed = mapCsv(parseCSV(String(rd.result))); S.file = f.name; renderPreview(); $("crPreview").scrollIntoView({ behavior:"smooth", block:"nearest" }); }
    catch(e){ S.parsed = null; $("crPreview").innerHTML = '<div class="cr-bad">'+h(e.message)+'</div>'; }
  };
  rd.readAsText(f);
}

async function load(){
  const j = await call("/state");
  S.data = j;
}
function wire(){
  const drop = $("crDrop"), file = $("crFile");
  drop.onclick = () => file.click();
  drop.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); file.click(); } };
  file.onchange = () => onFile(file.files[0]);
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e=>{ const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; onFile(f); });
  $("crSunday").onchange = () => { updateWeekLbl(); renderPreview(); };
  $("crSunday").value = sundayOnOrBefore(todayStr()); updateWeekLbl();
  $("crPrev").onclick = () => { const w = weekList(), i = w.indexOf(S.week); if(i >= 0 && i < w.length-1){ S.week = w[i+1]; render(); } };
  $("crNext").onclick = () => { const w = weekList(), i = w.indexOf(S.week); if(i > 0){ S.week = w[i-1]; render(); } };
  $("crLatest").onclick = () => { S.week = weekList()[0] || null; render(); };
  $("crTable").addEventListener("click", e=>{ const b = e.target.closest("[data-k]"); if(!b) return; const k = b.getAttribute("data-k"); S.open[k] = !S.open[k]; render(); });
  // the page also lets people drop a file anywhere on this section
  const sec = $("crSec");
  sec.addEventListener("dragover", e=>{ e.preventDefault(); });
  sec.addEventListener("drop", e=>{ if(e.target.closest("#crDrop")) return; e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; onFile(f); });
}
wire();
load().then(()=>{ render(); }).catch(e=>{
  $("crTable").innerHTML = '<tbody><tr><td class="empty">Could not load the connect rate data: '+h(e.message)+'</td></tr></tbody>';
});
})();
</script>
</body>
</html>
